<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>進階挑戰題</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Same lab-notebook palette as the Quiz 1 study page; a sticky toolbar carries mode, score and topic filter, questions are one column of cards */
:root {
  --bg: #f4f6f8; --surface: #ffffff; --fg: #17212b; --muted: #5a6876; --line: #d9e0e7;
  --accent: #1c6b86; --accent-soft: #e2eff4; --code-bg: #eef2f5; --mark: #b4541f;
  --good: #2f7a4a; --good-soft: #e3f2e8; --bad: #b23b3b; --bad-soft: #f8e5e5;
  --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1317; --surface: #151c22; --fg: #e2e8ee; --muted: #94a2af; --line: #263139;
    --accent: #63b5d2; --accent-soft: #15303a; --code-bg: #1a232b; --mark: #e39a6c;
    --good: #7cc89a; --good-soft: #15291d; --bad: #ec8b8b; --bad-soft: #351a1a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1317; --surface: #151c22; --fg: #e2e8ee; --muted: #94a2af; --line: #263139;
  --accent: #63b5d2; --accent-soft: #15303a; --code-bg: #1a232b; --mark: #e39a6c;
  --good: #7cc89a; --good-soft: #15291d; --bad: #ec8b8b; --bad-soft: #351a1a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: 64px;
}
a { color: var(--accent); text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 820px; margin: 0 auto; }

.mast { padding-block: 40px 18px; }
.eyebrow { font-size: 13px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
h1 { font-family: var(--font-display); font-weight: 900; font-size: clamp(28px, 5vw, 40px); line-height: 1.25; margin: 6px 0 10px; text-wrap: balance; }
.mast p { margin: 0; color: var(--muted); max-width: 64ch; }

.bar {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: 12px 0 10px; border-bottom: 1px solid var(--line);
  display: grid; gap: 10px;
}
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 5px 14px; cursor: pointer; font-size: 14px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); font-weight: 700; }
.score { font-family: var(--font-mono); font-size: 14px; color: var(--muted); margin-left: auto; white-space: nowrap; }
.score b { color: var(--fg); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 12px; cursor: pointer; font-size: 14px; }
.btn[aria-pressed="true"] { border-color: var(--bad); color: var(--bad); font-weight: 700; }
:root { --extc: #1d4ed8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --extc: #8fb0ff; } }
:root[data-theme="dark"] { --extc: #8fb0ff; }
.q.x h3 > span:last-child, .q.x .opt span:last-child { color: var(--extc); }
.ext { display: inline-block; font-size: 12px; font-weight: 600; color: var(--extc); border: 1px solid var(--extc); border-radius: 6px; padding: 0 6px; margin-right: 6px; vertical-align: 2px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.chip { flex: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 11px; background: var(--surface); cursor: pointer; font-size: 13.5px; color: var(--muted); white-space: nowrap; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--fg); font-weight: 700; }
.chip small { font-family: var(--font-mono); margin-left: 4px; }

.sec-title { font-family: var(--font-display); font-size: 21px; margin: 34px 0 6px; padding-bottom: 6px; border-bottom: 2px solid var(--accent); }
.sec-title span { font-family: var(--font-body); font-size: 14px; color: var(--muted); font-weight: 400; margin-left: 8px; }

.q { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-top: 14px; }
.q h3 { font-size: 16.5px; line-height: 1.6; margin: 0 0 10px; font-weight: 700; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; }
.q h3 .no { font-family: var(--font-mono); color: var(--accent); font-weight: 600; }
.opts { display: grid; gap: 6px; }
.opt { display: grid; grid-template-columns: 1.6em minmax(0, 1fr); gap: 6px; text-align: left; border: 1px solid var(--line); background: none; border-radius: 8px; padding: 7px 12px; cursor: pointer; line-height: 1.6; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt:disabled { cursor: default; }
.opt .k { font-family: var(--font-mono); font-weight: 600; color: var(--muted); }
.opt.ok { border-color: var(--good); background: var(--good-soft); font-weight: 700; }
.opt.ok .k { color: var(--good); }
.opt.no { border-color: var(--bad); background: var(--bad-soft); }
.opt.no .k { color: var(--bad); }
.ans { margin-top: 10px; padding: 9px 14px; border-left: 3px solid var(--accent); background: var(--code-bg); border-radius: 0 8px 8px 0; font-size: 15px; }
.ans b { color: var(--good); }
.ans .wrong { color: var(--bad); font-weight: 700; }
.empty { color: var(--muted); text-align: center; padding: 48px 0; }
.foot { margin-top: 40px; font-size: 14px; color: var(--muted); }
@media (max-width: 560px) {
  .score { margin-left: 0; width: 100%; }
  .q { padding: 14px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="eyebrow">AIoT-DA · Quiz 1 準備</div>
    <h1>進階挑戰題：100 題</h1>
    <p>比 <a href="quiz1-question-bank.html">209 題題庫</a> 難一級的加強版，作答紀錄和題庫、<a href="quiz1-chatgpt-bank.html">ChatGPT 考題專區</a> 分開記。以兩步以上的計算、連續題（承上題）和陷阱題為主；需要 ln、e、開根號的地方題目都直接給數值，不用計算機。範圍只有監督式學習（不含 MLP、LDA、K-means）。</p>
  </header>

  <div class="bar">
    <div class="row">
      <div class="seg" role="group" aria-label="模式">
        <button type="button" data-mode="practice">練習</button>
        <button type="button" data-mode="review">看答案</button>
      </div>
      <button type="button" class="btn" id="wrongOnly" aria-pressed="false">只看答錯</button>
      <button type="button" class="btn" id="hideExt" aria-pressed="false" title="延伸題：老師課程資料沒有提到的觀念">隱藏延伸題</button>
      <button type="button" class="btn" id="reset">重設作答</button>
      <div class="score" id="score"></div>
    </div>
    <div class="chips" id="chips" role="group" aria-label="主題"></div>
  </div>

  <main id="list"></main>
  <p class="foot">題目由 Claude 依課程範圍出題，非老師公布的官方題目；計算題答案皆以程式驗算。藍色、標「延伸」的題目考的是老師課程資料（L05～L07、Notion 範圍頁）沒有提到的延伸觀念。</p>
</div>

<script>
const DATA = {"topics":[{"k":"lin","zh":"線性迴歸","en":"Linear Regression"},{"k":"reg","zh":"Ridge／Lasso","en":"Regularization"},{"k":"log","zh":"邏輯斯迴歸","en":"Logistic Regression"},{"k":"knn","zh":"K 近鄰","en":"KNN"},{"k":"svm","zh":"支援向量機","en":"SVM"},{"k":"nb","zh":"朴素貝氏","en":"Naive Bayes"},{"k":"dt","zh":"決策樹","en":"Decision Tree"},{"k":"rf","zh":"隨機森林","en":"Random Forest"},{"k":"gb","zh":"梯度提升","en":"Gradient Boosting"},{"k":"met","zh":"評估指標與實務","en":"Evaluation"}],"items":[{"n":1,"t":"lin","s":"資料 (1, 1)、(2, 3)、(3, 2)、(4, 4)，用最小平方法求出的迴歸線為何？","o":["β₁ = 1、β₀ = 0","β₁ = 0.8、β₀ = 2.5","β₁ = 1.25、β₀ = −0.625","β₁ = 0.8、β₀ = 0.5"],"a":3,"e":"x̄ = ȳ = 2.5；離差相乘加總 = 2.25 − 0.25 − 0.25 + 2.25 = 4，Σ(x − x̄)² = 5，β₁ = 4 ÷ 5 = 0.8；β₀ = 2.5 − 0.8 × 2.5 = 0.5。1.25 是分子分母顛倒；β₀ = 2.5 是直接拿 ȳ 當截距。"},{"n":2,"t":"lin","s":"承上題（ŷ = 0.5 + 0.8x），這條線在訓練資料上的 R² 是多少？","o":["0.36","0.8","0.64","1.8"],"a":2,"e":"ŷ = 1.3、2.1、2.9、3.7，殘差 −0.3、0.9、−0.9、0.3，SSE = 0.09 + 0.81 + 0.81 + 0.09 = 1.8；SST = 2.25 + 0.25 + 0.25 + 2.25 = 5。R² = 1 − 1.8 ÷ 5 = 0.64。0.36 是 SSE ÷ SST；0.8 是相關係數 r（R² = r²）。"},{"n":3,"t":"lin","s":"含截距的簡單線性迴歸（一個特徵）中，R² 和 x、y 的相關係數 r 有什麼關係？","o":["R² = r","R² = r²","R² = 2r","兩者沒有關係"],"a":1,"e":"簡單線性迴歸的 R² 剛好等於相關係數的平方，例如上一題 r = 0.8、R² = 0.64。所以 R² 不會告訴你關係是正是負，r 才看得出方向。","x":1},{"n":4,"t":"lin","s":"把特徵 x 的單位從「公尺」改成「公分」（數值乘以 100），重新用最小平方法擬合，斜率 β₁ 和 R² 會怎樣？","o":["β₁ 變成原本的 1/100，R² 不變","β₁ 變成 100 倍，R² 變成 100 倍","β₁ 和 R² 都不變","β₁ 和 R² 都變成 1/100"],"a":0,"e":"x 放大 100 倍，要維持同樣的預測，斜率就要縮小 100 倍；預測值和殘差完全一樣，所以 SSE、SST、R² 都不變。這也是為什麼沒有正則化的線性迴歸不需要標準化也能得到相同預測。"},{"n":5,"t":"lin","s":"把所有的 y 都加上 10（例如每筆價格都多 10 元），重新擬合線性迴歸，哪些量會改變？","o":["斜率增加 10","R² 變大","什麼都不會改變","只有截距 β₀ 增加 10，斜率和 R² 都不變"],"a":3,"e":"y 整體平移，ȳ 也增加 10，離差 y − ȳ 不變，所以斜率 β₁ = Σ(x − x̄)(y − ȳ) ÷ Σ(x − x̄)² 不變；β₀ = ȳ − β₁x̄ 增加 10。殘差和 SST 都不變，R² 也不變。"},{"n":6,"t":"lin","s":"在訓練資料上用最小平方法，多加一個和 y 完全無關的隨機特徵，訓練 R² 和 Adjusted R² 通常會怎樣？","o":["兩者都一定下降","兩者都一定上升","R² 不會下降，Adjusted R² 可能下降","R² 下降，Adjusted R² 上升"],"a":2,"e":"多一個特徵，最小平方法至少可以把它的係數設成 0，所以訓練 SSE 不會變大、R² 不會下降。Adjusted R² 會懲罰特徵數，沒用的特徵讓它下降。","x":1},{"n":7,"t":"lin","s":"線性迴歸的殘差對預測值畫圖，呈現明顯的 U 形（兩端正、中間負），最可能代表什麼？","o":["異質變異（殘差越來越散開）","真實關係是曲線，模型漏掉了非線性項","多重共線性","模型完全正確"],"a":1,"e":"殘差有規律代表模型一直犯同一種錯。U 形表示直線形狀不對，可以加 x² 這類多項式特徵；殘差越來越散開（漏斗狀）才是異質變異。"},{"n":8,"t":"lin","s":"兩個特徵高度共線（幾乎是彼此的倍數）時，下列敘述何者最正確？","o":["個別係數的大小和正負號很不穩定，但整體預測仍可能不錯","預測能力一定變得很差","R² 一定下降","兩個係數都會自動變成 0"],"a":0,"e":"共線時，模型很難分辨效果該算在哪個特徵上，係數可能出現 +500、−480 互相抵銷的情況；但兩者加起來的效果還在，所以預測不一定變差。"},{"n":9,"t":"lin","s":"含截距的最小平方法在訓練資料上，殘差 eᵢ = yᵢ − ŷᵢ 一定滿足下列哪一個性質？","o":["Σeᵢ² = 0","每個 eᵢ 都 ≥ 0","Σeᵢ = n","Σeᵢ = 0"],"a":3,"e":"對截距 β₀ 微分令其為 0，就得到 Σeᵢ = 0，殘差正負剛好抵消。這也是為什麼殘差不平方直接相加會得到 0。","x":1},{"n":10,"t":"lin","s":"成本函數 J(a, b) = (1/n) Σ(yᵢ − (axᵢ + b))²，對斜率 a 的偏微分是什麼？","o":["(2/n) Σ (yᵢ − (axᵢ + b))","−(2/n) Σ (yᵢ − (axᵢ + b))","−(2/n) Σ xᵢ(yᵢ − (axᵢ + b))","(1/n) Σ xᵢ²"],"a":2,"e":"用連鎖律：外層平方微分得 2(yᵢ − ŷᵢ)，內層對 a 微分得 −xᵢ，所以是 −(2/n) Σ xᵢ(yᵢ − ŷᵢ)。不帶 xᵢ 的那一個是對截距 b 的偏微分。"},{"n":11,"t":"lin","s":"用梯度下降訓練線性迴歸時，發現成本 J 每一輪都在變大，而且越來越大，最可能的原因是什麼？","o":["學習率太小","學習率 α 太大，每一步都跨過最低點而發散","資料量太大","特徵已經標準化"],"a":1,"e":"更新是 a ← a − α ∂J/∂a。α 太大時，每一步都衝過最低點，跳到另一邊更高的地方，越跳越遠就會發散；α 太小只會收斂得很慢，不會讓 J 變大。"},{"n":12,"t":"lin","s":"某條用最小平方法擬合的迴歸線，訓練 R² = 0.9，測試 R² = −0.2，下列判斷何者最合理？","o":["模型過擬合，而且在測試資料上比直接猜平均值還差","一定算錯了，R² 不可能是負的","模型欠擬合","測試資料上的表現比訓練資料好"],"a":0,"e":"訓練 R²（OLS）一定介於 0 和 1；測試資料上 SSE 可能大於 SST，R² 就會是負的，表示比只猜平均值還差。訓練好、測試差，是典型的過擬合。"},{"n":13,"t":"reg","s":"單一特徵（已減去平均），Sxy = 8、Sxx = 2、λ = 2。用單一特徵公式，Ridge 和 Lasso 的係數分別是多少？","o":["Ridge = 4、Lasso = 3","Ridge = 2、Lasso = 3","Ridge = 2.67、Lasso = 3.5","Ridge = 2、Lasso = 3.5"],"a":3,"e":"Ridge：8 ÷ (2 + 2) = 2。Lasso：max(|8| − λ/2, 0) ÷ 2 = (8 − 1) ÷ 2 = 3.5。Lasso = 3 是忘了 λ 要先除以 2；4 是沒有正則化的 OLS（8 ÷ 2）。","x":1},{"n":14,"t":"reg","s":"承上題（Sxy = 8），λ 至少要多大，Lasso 才會把係數壓成 0？","o":["λ ≥ 8","λ ≥ 4","λ ≥ 16","不管 λ 多大都不會變 0"],"a":2,"e":"歸零條件是 |Sxy| − λ/2 ≤ 0，也就是 λ ≥ 2|Sxy| = 16。「永遠不會變 0」是 Ridge 的特性。","x":1},{"n":15,"t":"reg","s":"Ridge 的 λ 趨近無限大時（截距不受懲罰），模型的預測值會趨近什麼？","o":["0","y 的平均值 ȳ","無限大","和普通最小平方法相同"],"a":1,"e":"λ 無限大時，所有係數 βⱼ 都被壓到 0，只剩下不受懲罰的截距，最佳的截距就是 ȳ，所以每一筆都預測平均值，等於嚴重欠擬合。"},{"n":16,"t":"reg","s":"兩個特徵完全相同（複製一份），分別用 Ridge 和 Lasso，通常會得到什麼結果？","o":["Ridge 把係數平分給兩個特徵；Lasso 傾向只留一個、另一個設成 0","兩者都把係數平分","兩者都只留一個","兩者都把兩個係數設成 0"],"a":0,"e":"L2 懲罰 β₁² + β₂² 在總和固定時，平分最小，所以 Ridge 平分；L1 懲罰 |β₁| + |β₂| 對怎麼分配不敏感，常常落在角點，只留一個。也因此 Lasso 在相關特徵間的選擇不穩定。","x":1},{"n":17,"t":"reg","s":"從幾何角度看，為什麼 L1（Lasso）比 L2（Ridge）更容易讓係數剛好等於 0？","o":["L1 的限制區域是圓形，沒有角","L1 會把係數平方，所以變小比較快","L1 的懲罰比較小","L1 的限制區域是菱形，尖角落在座標軸上，誤差等高線容易先碰到角點"],"a":3,"e":"解在「誤差等高線第一次碰到限制區域」的地方。菱形的角點正好在座標軸上（某個係數 = 0），圓形則沒有角，碰到的地方通常兩個係數都不是 0。"},{"n":18,"t":"reg","s":"特徵沒有標準化：A 的數值很大（係數很小），B 的數值很小（係數很大）。加上 Ridge 懲罰後，主要會發生什麼事？","o":["A 的係數被壓得比較重","兩者受到同樣程度的懲罰","B 的係數被壓得比較重，A 幾乎不受影響","懲罰和特徵數值大小無關，結果和 OLS 一樣"],"a":2,"e":"懲罰看的是係數大小 Σβ²，單位小的特徵需要大係數，所以被罰得特別重；這種不公平跟特徵本身重不重要無關，因此要先標準化。"},{"n":19,"t":"reg","s":"用交叉驗證挑 Ridge 的 λ，λ 從 0 慢慢增大時，驗證誤差通常呈現什麼形狀？","o":["一直下降，所以 λ 越大越好","先下降再上升（U 形），選最低點的 λ","一直上升，所以 λ = 0 最好","完全不變"],"a":1,"e":"λ 太小時過擬合（變異大），λ 太大時欠擬合（偏差大），中間某個 λ 驗證誤差最低。訓練誤差則是隨 λ 增大一直上升。"},{"n":20,"t":"reg","s":"哪一種情況下，Elastic Net 通常比單用 Lasso 更適合？","o":["有一群彼此高度相關、而且都有用的特徵","只有一個特徵","特徵彼此完全獨立而且都沒用","資料量遠大於特徵數，而且沒有共線性"],"a":0,"e":"Lasso 在一群相關特徵中常常只隨便留一個；Elastic Net 加入 L2 後，會傾向把這群特徵一起保留、係數分攤，結果比較穩定。"},{"n":21,"t":"reg","s":"特徵數 p 大於樣本數 n 時，下列敘述何者正確？","o":["普通最小平方法一定最好","Ridge 和 Lasso 都無法使用","必須先刪除樣本到 n < p","普通最小平方法沒有唯一解，Ridge 仍有唯一解"],"a":3,"e":"p > n 時 XᵀX 不可逆，OLS 有無限多組解；Ridge 的 XᵀX + λI 一定可逆，所以有唯一解。","x":1},{"n":22,"t":"reg","s":"邏輯迴歸的正則化參數 C 從 1 改成 0.01，效果相當於什麼？","o":["正則化變弱，係數變大","完全沒有影響","正則化變強（相當於 λ 變大），係數被壓得更小","把模型變成 Lasso"],"a":2,"e":"C 是正則化強度的倒數（C = 1/λ）。C 變小 100 倍，等於 λ 變大 100 倍，係數受到更強的懲罰，模型更簡單。"},{"n":23,"t":"log","s":"邏輯迴歸 w = 2、b = −4，x = 1 時，預測為正類的機率 p 是多少？（σ(−2) ≈ 0.119、σ(2) ≈ 0.881）","o":["0.881","0.119","−2","0.5"],"a":1,"e":"z = 2 × 1 − 4 = −2，p = σ(−2) ≈ 0.119。0.881 是 σ(2)，正負號弄反；−2 是 z 本身，還沒經過 sigmoid。"},{"n":24,"t":"log","s":"承上題（p ≈ 0.119），這一筆的實際類別是 y = 0，log-loss 是多少？（−ln 0.881 ≈ 0.127、−ln 0.119 ≈ 2.13）","o":["0.127","2.13","0.119","0.881"],"a":0,"e":"y = 0 要看模型給「答對那一類（0）」的機率 1 − p = 0.881，L = −ln 0.881 ≈ 0.127，罰分很小，因為模型有把握又答對了。2.13 是誤用了 y = 1 的公式 −ln p。"},{"n":25,"t":"log","s":"邏輯迴歸 z = x₁ + 2x₂ − 4，門檻 0.5。下列哪一點會被判成正類？","o":["(1, 1)","(0, 1)","(1, 0)","(3, 1)"],"a":3,"e":"p ≥ 0.5 ⇔ z ≥ 0。(3, 1)：z = 3 + 2 − 4 = 1 > 0，判正類；(1, 1)：z = −1；(0, 1)：z = −2；(1, 0)：z = −3，都判負類。決策邊界是直線 x₁ + 2x₂ = 4。"},{"n":26,"t":"log","s":"邏輯迴歸中某特徵的係數 w = ln 2 ≈ 0.693。這個特徵增加 1（其他不變），會怎樣？","o":["勝算變成原本的 0.693 倍","機率直接增加 0.693","勝算（odds）變成原本的 2 倍","機率變成原本的 2 倍"],"a":2,"e":"log-odds 增加 w，勝算就乘上 eʷ = e^(ln 2) = 2。機率不是直接加倍，增加多少要看原本的機率在哪裡。","x":1},{"n":27,"t":"log","s":"某事件的機率 p = 0.8，它的 log-odds（logit）是多少？（ln 4 ≈ 1.386）","o":["4","1.386","0.8","0.223"],"a":1,"e":"勝算 = 0.8 ÷ 0.2 = 4，log-odds = ln 4 ≈ 1.386。4 是勝算本身還沒取 ln；0.223 是 −ln 0.8，那是 log-loss 的值。","x":1},{"n":28,"t":"log","s":"訓練資料完全線性可分，而且不加正則化，用梯度下降訓練邏輯迴歸，會發生什麼事？","o":["權重 w 會一直變大、不收斂，機率被推向 0 或 1","很快收斂到一組有限的權重","權重一直變小到 0","log-loss 會一直變大"],"a":0,"e":"w 越大，sigmoid 越陡，每一點的機率越接近正確答案，log-loss 就越小，所以最小化 log-loss 會把 w 推向無限大。加正則化可以避免。","x":1},{"n":29,"t":"log","s":"為什麼邏輯迴歸不用 MSE 當損失函數，而用 log-loss（交叉熵）？","o":["MSE 無法計算","log-loss 計算比較快","MSE 只能用在分類","MSE 搭配 sigmoid 不是凸函數，有局部最小值；log-loss 是凸的"],"a":3,"e":"把 sigmoid 代進 MSE 後，損失曲面不是凸的，梯度下降可能卡住；log-loss 由最大概似推得，對邏輯迴歸是凸函數，而且對「很有把握地答錯」罰得很重。"},{"n":30,"t":"log","s":"單一筆資料 x = 2、y = 1，模型目前給 p = 0.3。log-loss 對 w 的梯度是 (p − y)x，學習率 η = 0.5，這一步 w 會怎麼更新？","o":["w 減少 0.7","w 增加 1.4","w 增加 0.7","w 不變"],"a":2,"e":"梯度 = (0.3 − 1) × 2 = −1.4；w ← w − η × 梯度 = w − 0.5 × (−1.4) = w + 0.7。實際是正類但機率偏低，所以 w 往讓 z 變大的方向調。","x":1},{"n":31,"t":"log","s":"把邏輯迴歸的門檻從 0.5 調高到 0.9，Precision 和 Recall 通常會怎樣？","o":["Precision 下降、Recall 上升","Precision 上升、Recall 下降","兩者都上升","兩者都不變"],"a":1,"e":"門檻越高，只有非常有把握的才判正類：誤報（FP）變少，所以 Precision 上升；但很多真正的正類也被判成負類（FN 變多），Recall 下降。","x":1},{"n":32,"t":"log","s":"只有一個特徵 x 的邏輯迴歸，決策邊界是一個點。如果改用特徵 x 和 x²，在原本的 x 軸上決策邊界可以變成什麼？","o":["最多兩個切點（例如中間判一類、兩邊判另一類）","仍然只有一個點","一定沒有邊界","無限多個切點"],"a":0,"e":"z = w₁x + w₂x² + b = 0 是二次方程式，最多兩個根，所以可以出現「x 在某區間內判 1、外面判 0」的邊界。邏輯迴歸對新特徵仍是線性，但在原空間可以畫出非線性邊界。"},{"n":33,"t":"log","s":"sigmoid 的導數 σ′(z) = σ(z)(1 − σ(z))，它的最大值是多少？出現在哪裡？","o":["0.5，在 z = 0","1，在 z = 0","0.25，在 z 趨近無限大","0.25，在 z = 0"],"a":3,"e":"z = 0 時 σ = 0.5，σ′ = 0.5 × 0.5 = 0.25 是最大值；z 很大或很小時 σ 接近 1 或 0，導數接近 0，所以 sigmoid 兩端很平、梯度很小。"},{"n":34,"t":"log","s":"有 3 個類別時，用 One-vs-Rest 做多類別邏輯迴歸，需要訓練幾個二元分類器？預測時怎麼決定類別？","o":["2 個；兩兩比較","1 個；直接輸出 3 種類別","3 個；選給出機率（分數）最高的那一類","6 個；每一對類別各一個"],"a":2,"e":"One-vs-Rest 每一類各訓練一個「這一類 vs 其他」的分類器，3 類就是 3 個，預測時選分數最高的。兩兩比較的作法是 One-vs-One，3 類需要 3 個。","x":1},{"n":35,"t":"knn","s":"訓練資料：A 類 (0, 0)、(2, 4)；B 類 (3, 2)、(4, 4)、(2, 1)。新點 q = (2, 2)，用歐氏距離、k = 3，預測哪一類？","o":["A","B","平手","無法判斷"],"a":1,"e":"距離：(3, 2) = 1、(2, 1) = 1、(2, 4) = 2、(0, 0) = √8 ≈ 2.83、(4, 4) = √8 ≈ 2.83。前 3 名是 B、B、A，B 有 2 票，預測 B。"},{"n":36,"t":"knn","s":"q = (0, 0)，P = (3, 0)、R = (2, 2)。分別用歐氏距離和曼哈頓距離，誰離 q 比較近？（√8 ≈ 2.83）","o":["歐氏距離 R 比較近；曼哈頓距離 P 比較近","兩種距離都是 R 比較近","兩種距離都是 P 比較近","兩點一樣近"],"a":0,"e":"歐氏：P = 3、R = √(4 + 4) ≈ 2.83，R 比較近。曼哈頓：P = 3 + 0 = 3、R = 2 + 2 = 4，P 比較近。換距離公式，KNN 的鄰居和答案可能跟著改變。","x":1},{"n":37,"t":"knn","s":"年齡的範圍是 20～60 歲，用 Min-Max 標準化，35 歲會變成多少？","o":["0.583","0.35","15","0.375"],"a":3,"e":"x′ = (35 − 20) ÷ (60 − 20) = 15 ÷ 40 = 0.375。0.583 是 35 ÷ 60；15 是只減了最小值、忘了除以範圍。"},{"n":38,"t":"knn","s":"KNN 回歸，k = 3，三個鄰居的 y 值是 10、20、60。不用距離加權時，預測值是多少？","o":["20","60","30","10"],"a":2,"e":"KNN 回歸取 k 個鄰居的平均：(10 + 20 + 60) ÷ 3 = 30。20 是中位數；平均數容易被 60 這種極端值拉高。"},{"n":39,"t":"knn","s":"KNN 分類把 k 設成訓練資料的總筆數 n，會發生什麼事？","o":["模型變得最準","不管新點在哪裡，都預測訓練資料中最多的那一類","每一點都預測最近那一點的類別","模型無法計算"],"a":1,"e":"k = n 時每次都看全部資料投票，結果永遠是多數類，完全忽略新點的位置，是極端的欠擬合。"},{"n":40,"t":"knn","s":"在 KNN 的特徵裡加入很多和答案無關的雜訊特徵，通常會怎樣？","o":["距離被無關特徵主導，找到的鄰居變得不可靠，效果變差","效果一定變好，因為資訊更多","完全沒有影響","預測速度變快"],"a":0,"e":"KNN 把每個特徵平等地算進距離，無關特徵的差異也會拉大或縮小距離，讓「真正相似」的點不再是最近的；維度一高，距離也越來越沒有區辨力。"},{"n":41,"t":"knn","s":"關於 KNN 的計算成本，下列敘述何者正確？","o":["訓練很慢，預測很快","訓練和預測都很快","訓練和預測都不需要計算距離","訓練幾乎不用計算，但每次預測都要和所有訓練資料算距離"],"a":3,"e":"KNN 是懶惰學習：訓練只是把資料存起來；預測時才計算新點到每一筆資料的距離並排序，所以資料越多預測越慢。"},{"n":42,"t":"knn","s":"兩類的 KNN 分類，為什麼 k 常建議取奇數？","o":["奇數比較快","偶數無法計算距離","避免投票平手","奇數一定比較準"],"a":2,"e":"兩類時 k 是偶數就可能出現 2 : 2 這種平手，需要額外規則處理；取奇數可以避免。"},{"n":43,"t":"knn","s":"用訓練資料本身評估 KNN，k = 1 時的訓練誤差通常是多少？","o":["50%","0（每一點最近的鄰居就是自己）","100%","和 k = n 時一樣"],"a":1,"e":"k = 1 時每一筆訓練資料最近的鄰居就是它自己，所以訓練誤差是 0（除非有重複的點標籤不同）。訓練誤差為 0 正是過擬合的徵兆，要看驗證誤差選 k。"},{"n":44,"t":"svm","s":"SVM 的權重 w = (6, 8)（已縮放成最近的點 y · f = 1），兩條間隔邊界之間的總寬度是多少？","o":["0.2","0.1","10","0.5"],"a":0,"e":"‖w‖ = √(36 + 64) = 10，總寬度 = 2 ÷ ‖w‖ = 0.2；0.1 是單側（分隔線到邊界）的距離 1 ÷ ‖w‖；10 是 ‖w‖ 本身。"},{"n":45,"t":"svm","s":"SVM 分隔線 f(x) = 2x₁ + x₂ − 4，點 (2, 1) 的類別 y = +1。這個點的狀態和 hinge loss 是什麼？","o":["判錯，hinge loss = 2","在間隔內，hinge loss = 0.5","離邊界很遠，hinge loss = 1","剛好在間隔邊界上（支援向量），hinge loss = 0"],"a":3,"e":"f = 4 + 1 − 4 = 1，y · f = 1，剛好在 f = +1 的邊界上，是支援向量；hinge = max(0, 1 − 1) = 0。"},{"n":46,"t":"svm","s":"承上題（f(x) = 2x₁ + x₂ − 4），點 (1, 1) 的類別 y = +1，hinge loss 是多少？","o":["0","1","2","−1"],"a":2,"e":"f = 2 + 1 − 4 = −1，y · f = −1 < 0，判錯；hinge = max(0, 1 − (−1)) = 2。hinge loss 不會是負數。"},{"n":47,"t":"svm","s":"SVM 寫成 f = 3x₁ + 3x₂ − 9，但最近的點 y · f = 3（還沒縮放成 1）。這條線實際的間隔總寬度是多少？（√18 ≈ 4.243）","o":["約 0.471","約 1.414","約 4.243","約 0.333"],"a":1,"e":"點到線的距離是 |f| ÷ ‖w‖，最近的點 |f| = 3、‖w‖ = √18 ≈ 4.243，單側距離 ≈ 0.707，總寬 ≈ 1.414。直接套 2 ÷ ‖w‖ 會得到 0.471，那是忘了先縮放成 y · f = 1。"},{"n":48,"t":"svm","s":"軟間隔 SVM 的 C 設得非常大時，模型最接近什麼？","o":["硬間隔：幾乎不容許任何點違規，間隔變窄、容易過擬合","完全不在乎分類錯誤，間隔最寬","變成邏輯迴歸","所有點都變成支援向量"],"a":0,"e":"目標是 ½‖w‖² + C Σhinge。C 越大，違規的罰分越重，模型會犧牲間隔寬度去把每個點分對，最接近硬間隔 SVM。"},{"n":49,"t":"svm","s":"RBF 核的 γ 設得非常大時，決策邊界通常會變成什麼樣子？","o":["一條直線","完全平滑的大曲線","所有點都判成同一類","每個訓練點周圍各自一小塊區域，邊界很彎、容易過擬合"],"a":3,"e":"γ 大代表每個樣本的影響範圍很小，邊界會緊緊包住個別的點，訓練準確率很高但泛化差；γ 小則影響範圍大、邊界平滑。"},{"n":50,"t":"svm","s":"文字分類常有幾萬個特徵、但只有幾千筆資料，這時 SVM 通常優先選哪一種核？為什麼？","o":["RBF 核，因為高維一定需要非線性","多項式核，次數越高越好","線性核，因為高維資料通常已經接近線性可分，而且訓練快","不能用 SVM"],"a":2,"e":"特徵數遠大於樣本數時，資料在原空間就常常線性可分，線性核效果好又快、不容易過擬合；RBF 在這種情況下多半沒有明顯好處。"},{"n":51,"t":"svm","s":"訓練好的 SVM，把一個「不是支援向量、而且離間隔很遠」的點往外移動（移動後仍在間隔外、類別不變），分隔線會怎樣？","o":["一定往該點移動","不會改變","間隔一定變窄","所有支援向量都會改變"],"a":1,"e":"分隔線只由支援向量（落在間隔邊界上或間隔內的點）決定，其他點只要不跨進間隔，怎麼移動都不影響結果。"},{"n":52,"t":"svm","s":"SVM 的輸出 f(x) = 2.5，能不能直接說「屬於正類的機率是 2.5」或把它當機率使用？","o":["不能，f(x) 是到分隔線的有號距離（分數），要另外校準才能變成機率","可以，f(x) 就是機率","可以，只要除以 10","不能，SVM 完全沒有輸出"],"a":0,"e":"SVM 原生輸出的是分數：正負號代表類別、大小代表離分隔線多遠，不是 0～1 的機率。要機率得另外做校準，例如把分數再套一層 sigmoid 擬合。","x":1},{"n":53,"t":"svm","s":"軟間隔目標 ½‖w‖² + C Σhinge。線 A：½‖w‖² = 1、Σhinge = 3；線 B：½‖w‖² = 4、Σhinge = 0。C = 2 時 SVM 會選哪一條？","o":["線 A（目標值 1）","線 A（目標值 7）","兩條一樣","線 B（目標值 4，比線 A 的 7 小）"],"a":3,"e":"線 A：1 + 2 × 3 = 7；線 B：4 + 2 × 0 = 4，選目標值小的線 B。C = 1 時兩條都是 4 平手；C 越大越偏好沒有違規的線。"},{"n":54,"t":"svm","s":"XOR 資料：(1, 1)、(−1, −1) 是 +1，(1, −1)、(−1, 1) 是 −1。線性 SVM 最多能分對幾點？加入哪個特徵就能完全分開？","o":["4 點都能分對，不用加特徵","最多 2 點；加入 x₁ + x₂","最多 3 點；加入 x₁x₂","最多 3 點；加入 x₁ − x₂"],"a":2,"e":"兩類交錯在對角上，任何直線最多分對 3 點。x₃ = x₁x₂ 在 +1 類都是 1、在 −1 類都是 −1，用 x₃ = 0 就能分開；核函數就是自動做這類轉換。"},{"n":55,"t":"nb","s":"P(垃圾) = 0.2；P(字 | 垃圾) = 0.5、P(字 | 正常) = 0.05。信裡出現這個字，是垃圾信的機率約為多少？","o":["0.5","0.714","0.1","0.2"],"a":1,"e":"垃圾分數 0.2 × 0.5 = 0.1；正常分數 0.8 × 0.05 = 0.04；P(垃圾 | 字) = 0.1 ÷ (0.1 + 0.04) ≈ 0.714。0.1 是忘了除以總和；0.5 是把似然當成答案。"},{"n":56,"t":"nb","s":"P(垃圾) = P(正常) = 0.5。字 1：P(·| 垃圾) = 0.6、P(·| 正常) = 0.2；字 2：P(·| 垃圾) = 0.5、P(·| 正常) = 0.1。兩個字都出現，用朴素假設，垃圾信的機率約為多少？","o":["0.9375","0.75","0.83","0.15"],"a":0,"e":"垃圾：0.5 × 0.6 × 0.5 = 0.15；正常：0.5 × 0.2 × 0.1 = 0.01；0.15 ÷ 0.16 = 0.9375。0.15 是忘了除以總和；0.75、0.83 是只用了其中一個字。"},{"n":57,"t":"nb","s":"某字在 10 封垃圾信中都沒出現。用 Laplace 平滑（α = 1，出現／不出現兩種情況），P(字 | 垃圾) 是多少？","o":["0","1/10","1/11","1/12 ≈ 0.083"],"a":3,"e":"(0 + 1) ÷ (10 + 2 × 1) = 1/12。分母加 2α 是因為有「出現」「不出現」兩種情況，各加 1 次，兩者的機率加總才會等於 1。","x":1},{"n":58,"t":"nb","s":"實作朴素貝氏時，為什麼常把各項機率取 log 後相加，而不是直接相乘？","o":["log 會讓結果更準","相乘無法計算","很多個小於 1 的數連乘會小到電腦存不下（下溢），取 log 變成相加比較穩定","log 可以消除條件獨立假設"],"a":2,"e":"幾百個 0.01 等級的機率相乘，結果會小到變成 0；ln 是遞增函數，比大小的結果不變，連乘變連加也不會下溢。","x":1},{"n":59,"t":"nb","s":"P(垃圾) = 0.01（垃圾信非常少）；P(字 | 垃圾) = 0.5、P(字 | 正常) = 0.05。信裡出現這個字，最後會判成哪一類？","o":["垃圾（似然比有 10 倍）","正常（垃圾的機率只有約 0.09）","垃圾（機率約 0.91）","無法判斷"],"a":1,"e":"垃圾：0.01 × 0.5 = 0.005；正常：0.99 × 0.05 = 0.0495；P(垃圾) = 0.005 ÷ 0.0545 ≈ 0.092。似然雖然差 10 倍，但先驗差了 99 倍，最後仍判正常，這就是先驗的影響。"},{"n":60,"t":"nb","s":"高斯朴素貝氏（Gaussian Naive Bayes）訓練時，需要估計哪些參數？","o":["每個類別的先驗，以及每個類別下每個特徵的平均數和變異數","每個特徵之間的共變異數矩陣","一條分隔線的權重","每一筆資料的距離"],"a":0,"e":"朴素假設讓每個特徵在給定類別下各自獨立，所以每類每特徵只要一組平均數和變異數，不需要估計特徵之間的共變異數。"},{"n":61,"t":"nb","s":"「限時免費」這個詞總是和「免費」一起出現。兩個詞都放進朴素貝氏，對預測機率最可能有什麼影響？","o":["完全沒有影響","機率一定變得比較準","模型會自動刪掉其中一個","同一份證據被算兩次，機率變得過度極端（過度自信）"],"a":3,"e":"朴素假設把兩個詞當成獨立證據，相同的資訊被乘了兩次，後驗機率被推向 0 或 1；分類結果常常還是對的，但機率數值不可盡信。"},{"n":62,"t":"nb","s":"朴素貝氏和邏輯迴歸在建模方式上的根本差異是什麼？","o":["兩者都是直接學 P(C | x)","朴素貝氏用距離，邏輯迴歸用機率","朴素貝氏學每一類怎麼產生特徵 P(x | C) 和 P(C)（生成式）；邏輯迴歸直接學 P(C | x)（判別式）","邏輯迴歸是生成式模型"],"a":2,"e":"生成式模型先學「每一類長什麼樣」再用貝氏定理反推；判別式模型直接學分界或條件機率。","x":1},{"n":63,"t":"nb","s":"文件裡「免費」出現了 3 次。多項式朴素貝氏和伯努利朴素貝氏在處理這個特徵時，差別在哪裡？","o":["兩者都只看有沒有出現","多項式看出現次數（3 次），伯努利只看有沒有出現（有）","兩者都看出現次數","多項式只看有沒有出現，伯努利看次數"],"a":1,"e":"多項式朴素貝氏用詞頻計數；伯努利朴素貝氏用 0／1 表示出現與否，而且還會考慮「某詞沒出現」這件事。"},{"n":64,"t":"dt","s":"節點裡「是 3、否 1」，Gini 不純度是多少？","o":["0.375","0.625","0.25","0.5"],"a":0,"e":"p = (0.75, 0.25)，Gini = 1 − (0.5625 + 0.0625) = 0.375。0.625 是只算了 Σp²，忘了用 1 去減。"},{"n":65,"t":"dt","s":"節點裡「是 3、否 1」，熵（以 log₂ 為底）約是多少？（log₂ 0.75 ≈ −0.415、log₂ 0.25 = −2）","o":["0.375","1","0.5","0.811"],"a":3,"e":"H = −(0.75 × (−0.415) + 0.25 × (−2)) ≈ 0.311 + 0.5 = 0.811。0.375 是 Gini；1 是兩類各半時的最大值。"},{"n":66,"t":"dt","s":"父節點「是 4、否 4」，切成左（是 4、否 1）、右（是 0、否 3）。Gini 增益是多少？","o":["0.18","0.5","0.3","0.2"],"a":2,"e":"父 Gini = 0.5。左 Gini = 1 − (0.64 + 0.04) = 0.32，權重 5/8；右是純的，Gini = 0，權重 3/8。切後 = 5/8 × 0.32 = 0.2，增益 = 0.5 − 0.2 = 0.3。0.2 是切後的 Gini。"},{"n":67,"t":"dt","s":"父節點「是 4、否 4」（熵 = 1），切成左（是 3、否 1）、右（是 1、否 3），兩邊熵都約 0.811。資訊增益約是多少？","o":["0.811","0.189","1.622","0"],"a":1,"e":"兩邊各佔 4/8，切後熵 = 0.5 × 0.811 + 0.5 × 0.811 = 0.811，增益 = 1 − 0.811 = 0.189。1.622 是兩邊熵直接相加、沒有加權。"},{"n":68,"t":"dt","s":"回歸樹要在 y = 1、2、10、11（已依 x 排序）之間找一個切點，讓兩邊的平方誤差總和最小。應該切在哪裡？","o":["2 和 10 之間（總平方誤差 1）","1 和 2 之間","10 和 11 之間","切哪裡都一樣"],"a":0,"e":"切在 2 和 10 之間：左邊平均 1.5，平方誤差 0.25 + 0.25 = 0.5；右邊平均 10.5，也是 0.5，合計 1。切在 1 和 2 之間：右邊 2、10、11 的平均約 7.67，平方誤差約 48.7，差很多。","x":1},{"n":69,"t":"dt","s":"用「資訊增益」選切分特徵時，像「顧客編號」這種每筆都不同的欄位會怎樣？為什麼？","o":["永遠不會被選中","增益是 0","會讓樹變得更簡單","會被優先選中，因為每個值一個葉子、每個葉子都純，增益最大；但完全無法泛化"],"a":3,"e":"取值越多的特徵越容易把資料切得很純，資訊增益偏好這種特徵；但「顧客編號」對新資料毫無意義。增益比（Gain Ratio）就是為了修正這個偏差。","x":1},{"n":70,"t":"dt","s":"一棵二元決策樹的最大深度限制為 3，最多會有幾個葉節點？","o":["3","6","8","9"],"a":2,"e":"每深一層，節點數最多加倍：深度 1 有 2 個、深度 2 有 4 個、深度 3 有 2³ = 8 個葉節點。"},{"n":71,"t":"dt","s":"真正的規則是「x₁ > x₂ 就是正類」（一條斜線）。直接用決策樹（只能問單一特徵的門檻），會發生什麼事？怎麼改善？","o":["切一刀就能完全正確","要用很多段階梯去逼近斜線；先做新特徵 x₁ − x₂，切一刀就完全正確","決策樹完全無法處理","只能改用 KNN"],"a":1,"e":"決策樹每次只問一個特徵，切線一定和座標軸平行，斜線要切很多刀才逼近；先做出 x₁ − x₂ 這個特徵，只要問「x₁ − x₂ > 0？」就完成了。"},{"n":72,"t":"dt","s":"把某個正數特徵取 log（單調遞增轉換）後重新訓練決策樹，結果會怎樣？","o":["切分結果和預測都不變，只是門檻數值換成 log 之後的值","樹的結構一定完全不同","準確率一定提高","決策樹不能處理取 log 的特徵"],"a":0,"e":"決策樹只比較大小順序，單調轉換不改變順序，所以能切出相同的分組；這也是決策樹不需要標準化的原因。"},{"n":73,"t":"dt","s":"關於「預剪枝」和「後剪枝」，下列何者正確？","o":["兩者完全相同","預剪枝是長完再剪","後剪枝會讓樹變得更深","預剪枝在長樹時就用最大深度、最少樣本數等條件提早停止；後剪枝先長完整棵樹再剪掉沒幫助的分支"],"a":3,"e":"預剪枝可能太早停而錯過後面有用的切分；後剪枝先長完再用驗證資料判斷哪些分支可以剪，通常效果較好但比較花時間。"},{"n":74,"t":"dt","s":"一棵不限深度的決策樹，每個葉節點都 100% 純，訓練準確率 100%，但測試準確率只有 60%。最可能的原因和對策是什麼？","o":["欠擬合；把樹長得更深","測試資料有問題，不用處理","過擬合，把雜訊也學進去了；限制深度、剪枝，或改用隨機森林","特徵需要標準化"],"a":2,"e":"「越純越好」的目標沒有停止的理由，會一直切到每個葉子都純，連雜訊都記住。限制成長、剪枝，或用很多棵樹平均，都能降低變異。"},{"n":75,"t":"rf","s":"每棵樹預測的變異數 σ² = 4，樹之間的相關係數 ρ = 0.3，B = 10 棵。用 Var = ρσ² + (1 − ρ)σ² ÷ B，平均後的變異數是多少？","o":["0.4","1.48","1.2","2.8"],"a":1,"e":"ρσ² = 0.3 × 4 = 1.2；(1 − ρ)σ² ÷ B = 0.7 × 4 ÷ 10 = 0.28；合計 1.48。0.4 是當成樹之間獨立（4 ÷ 10）；1.2 是只算了第一項。","x":1},{"n":76,"t":"rf","s":"承上題（σ² = 4、ρ = 0.3），樹的數量 B 增加到無限多，變異數會降到多少？","o":["1.2","0","0.28","4"],"a":0,"e":"第二項 (1 − ρ)σ² ÷ B 會趨近 0，但第一項 ρσ² = 1.2 和 B 無關，降不下去。要再降低，只能讓樹更不像（降低 ρ）。","x":1},{"n":77,"t":"rf","s":"3 棵互相獨立的樹，每棵判對的機率 p = 0.6，多數決（至少 2 棵對）判對的機率是多少？（0.6² = 0.36、0.6³ = 0.216）","o":["0.6","0.216","0.432","0.648"],"a":3,"e":"剛好 2 棵對：C(3, 2) × 0.36 × 0.4 = 0.432；3 棵都對：0.216；合計 0.648，比單棵的 0.6 高。0.432 是只算了剛好 2 棵對。","x":1},{"n":78,"t":"rf","s":"從 n 筆資料有放回地抽 n 筆（Bootstrap），n 很大時，某一筆資料完全沒被抽到的機率大約是多少？","o":["約 0.632","0.5","約 0.368（e⁻¹）","0"],"a":2,"e":"每次沒抽到它的機率是 1 − 1/n，抽 n 次都沒抽到是 (1 − 1/n)ⁿ，n 很大時趨近 e⁻¹ ≈ 0.368；所以每棵樹大約用到 63.2% 的不同資料，剩下的就是 OOB 樣本。","x":1},{"n":79,"t":"rf","s":"隨機森林每次切分時，只從隨機挑出的一部分特徵裡找最佳切點，主要目的是什麼？","o":["讓每棵樹更準","讓樹與樹之間更不相似（降低 ρ），平均後變異數降得更多","加快訓練是唯一目的","讓樹變得更淺"],"a":1,"e":"如果每棵樹都能選所有特徵，大家都會先用最強的那個特徵切，樹很像、ρ 很大；強迫每次只看部分特徵，樹之間差異變大，平均的效果更好。"},{"n":80,"t":"rf","s":"隨機森林把樹的數量從 100 棵增加到 1000 棵，最可能的結果是什麼？","o":["測試表現大致持平或略好，不太會因此過擬合，只是訓練和預測變慢","一定嚴重過擬合","一定欠擬合","準確率一定大幅提升"],"a":0,"e":"樹越多，平均越穩定，變異數只會下降到 ρσ² 為止，不會因為樹多而過擬合；代價是計算時間和模型大小。"},{"n":81,"t":"rf","s":"隨機森林裡的每一棵樹通常長得很深、不剪枝，為什麼這樣反而沒問題？","o":["深樹的變異比較低","隨機森林會自動剪枝","深樹比較快","深樹偏差低、變異高，而平均很多棵獨立程度高的樹可以把變異壓下來"],"a":3,"e":"隨機森林靠平均來降變異，但不能降偏差，所以每棵樹要先做到低偏差（長深）；梯度提升則相反，用淺樹、一輪一輪降偏差。"},{"n":82,"t":"rf","s":"訓練資料的 y 都在 0～100 之間。用隨機森林做回歸，遇到一筆特徵遠超出訓練範圍的新資料，預測值最可能是多少？","o":["可能遠大於 100，像線性迴歸一樣延伸","一定是 0","仍落在 0～100 之間，無法外推到範圍之外","一定是無限大"],"a":2,"e":"每棵樹的葉節點預測值是訓練資料的平均，森林再平均一次，所以預測值不會超出訓練時看過的 y 範圍；需要外推趨勢時，線性模型比較合適。","x":1},{"n":83,"t":"rf","s":"隨機森林的 OOB（Out-of-Bag）誤差有什麼用途？","o":["用來決定每棵樹的深度上限","用每棵樹沒抽到的資料估計泛化誤差，不必另外切驗證集","它就是訓練誤差","用來計算特徵的平均數"],"a":1,"e":"每筆資料大約有 36.8% 的樹沒用到它，就用這些樹對它投票，看準不準。這相當於免費的驗證集，常用來調參或檢查過擬合。","x":1},{"n":84,"t":"gb","s":"y = 4、6、14，F₀ = 平均 = 8。第一棵樹對三筆的輸出是 h₁ = −3、−3、6，學習率 η = 0.5。第三筆的 F₁ 是多少？","o":["11","14","8","17"],"a":0,"e":"F₁ = F₀ + η × h₁ = 8 + 0.5 × 6 = 11。14 是 η = 1 時的結果；17 是把 h 加在 y 上。"},{"n":85,"t":"gb","s":"承上題，F₁ = 6.5、6.5、11，訓練資料上的 SSE 是多少？（F₀ 時的 SSE = 56）","o":["56","9","6.5","15.5"],"a":3,"e":"殘差 4 − 6.5 = −2.5、6 − 6.5 = −0.5、14 − 11 = 3，SSE = 6.25 + 0.25 + 9 = 15.5，從 56 大幅下降。"},{"n":86,"t":"gb","s":"梯度提升把學習率 η 從 0.3 調小到 0.03，通常要怎麼搭配才能維持類似的表現？","o":["減少樹的數量","把每棵樹加深到不限深度","大幅增加樹的數量（輪數），並用驗證資料早停","不用改任何設定"],"a":2,"e":"η 變小，每棵樹的貢獻只有原本的 1/10，需要更多輪才能修完殘差；小 η 配多棵樹通常泛化較好，但要用驗證誤差決定何時停止。"},{"n":87,"t":"gb","s":"用平方誤差（MSE）當損失時，梯度提升每一輪新樹去擬合的「負梯度」等於什麼？","o":["y 本身","殘差 y − F(x)","F(x) 本身","殘差的平方"],"a":1,"e":"L = ½(y − F)²，對 F 微分是 −(y − F)，負梯度就是 y − F，也就是殘差。換成其他損失時，新樹擬合的就是那個損失的負梯度。","x":1},{"n":88,"t":"gb","s":"梯度提升和隨機森林在「降低誤差」的方式上，主要差別是什麼？","o":["梯度提升依序訓練、每棵樹修正前面的錯，主要降偏差；隨機森林平行訓練、取平均，主要降變異","兩者都主要降偏差","兩者都主要降變異","梯度提升平行訓練，隨機森林依序訓練"],"a":0,"e":"Boosting 一棵接一棵擬合殘差，把模型從簡單慢慢補強（降偏差）；Bagging 各棵樹獨立訓練後平均，讓預測更穩定（降變異）。"},{"n":89,"t":"gb","s":"梯度提升訓練時，訓練誤差一直下降，但驗證誤差在第 300 輪後開始上升。最適合的做法是什麼？","o":["繼續訓練到訓練誤差等於 0","把學習率調大","刪除驗證資料","早停：使用大約第 300 輪的模型"],"a":3,"e":"驗證誤差開始上升代表模型開始記住雜訊（過擬合）。早停（Early Stopping）就是在驗證誤差最低的輪數停下來。"},{"n":90,"t":"gb","s":"用 log-loss 做二元分類的梯度提升，每一輪新樹擬合的目標（負梯度）是什麼？","o":["y 本身","p 本身","y − p（實際類別減預測機率）","log-odds 的平方"],"a":2,"e":"log-loss 對 log-odds 分數微分的結果是 p − y，負梯度就是 y − p，形式和迴歸的殘差一樣：實際減預測。","x":1},{"n":91,"t":"gb","s":"梯度提升使用學習率 η = 1、每棵樹又很深，最容易發生什麼事？","o":["一定欠擬合","很快就把訓練資料（含雜訊）擬合得幾乎完美，嚴重過擬合","訓練誤差上升","完全不受影響"],"a":1,"e":"深樹本身就很強，η = 1 又完全不保留，幾輪之內就能把每個殘差都補上，連雜訊都學進去。所以梯度提升通常用淺樹加小學習率。"},{"n":92,"t":"gb","s":"XGBoost 在目標函數中加入正則化項，主要懲罰什麼？","o":["葉節點的數量和葉節點權重的大小，限制樹的複雜度","樹的數量越多越好","訓練資料的筆數","特徵的平均數"],"a":0,"e":"XGBoost 的目標 = 損失 + 正則化，正則化項懲罰葉子太多、葉子權重太大，讓每棵樹不要太複雜，降低過擬合。"},{"n":93,"t":"met","s":"1000 筆資料中，TP = 30、FP = 20、FN = 10、TN = 940。F1 分數是多少？","o":["約 0.97","約 0.675","約 0.75","約 0.667"],"a":3,"e":"Precision = 30 ÷ 50 = 0.6；Recall = 30 ÷ 40 = 0.75；F1 = 2 × 0.6 × 0.75 ÷ 1.35 ≈ 0.667（也可以用 2TP ÷ (2TP + FP + FN) = 60 ÷ 90）。0.97 是 Accuracy；0.675 是 P、R 的算術平均。"},{"n":94,"t":"met","s":"承上題（TP = 30、FP = 20、FN = 10、TN = 940），FPR（False Positive Rate）約是多少？","o":["約 0.4","約 0.25","約 0.021","約 0.979"],"a":2,"e":"FPR = FP ÷ (FP + TN) = 20 ÷ 960 ≈ 0.021；0.979 是 Specificity（1 − FPR）。注意 Accuracy 有 0.97，但模型其實漏掉 1/4 的正類。"},{"n":95,"t":"met","s":"某模型的 ROC-AUC = 0.3（明顯低於 0.5），最合理的解讀是什麼？","o":["模型比亂猜好","模型的排序和正確方向剛好相反，把預測反過來用，AUC 會變成 0.7","AUC 不可能小於 0.5，一定算錯","模型完美"],"a":1,"e":"AUC = 0.5 是亂猜；小於 0.5 代表模型系統性地把負類排在正類前面，把分數反轉就會得到 1 − 0.3 = 0.7。常見原因是標籤定義弄反。","x":1},{"n":96,"t":"met","s":"4 筆預測的誤差是 1、1、1、9。MAE 和 RMSE 分別是多少？（√21 ≈ 4.58）","o":["MAE = 3、RMSE ≈ 4.58","MAE = 3、RMSE = 3","MAE ≈ 4.58、RMSE = 3","MAE = 12、RMSE = 84"],"a":0,"e":"MAE = (1 + 1 + 1 + 9) ÷ 4 = 3；MSE = (1 + 1 + 1 + 81) ÷ 4 = 21，RMSE = √21 ≈ 4.58。RMSE 比 MAE 大很多，表示有一個大誤差，RMSE 對大誤差比較敏感。"},{"n":97,"t":"met","s":"下列哪一種做法會造成資料洩漏（Data Leakage）？","o":["先切分，再只用訓練集挑特徵","測試集只在最後評估一次","用交叉驗證時，每一折各自重做前處理","先用全部資料挑出和 y 最相關的特徵，再切分訓練集和測試集"],"a":3,"e":"用全部資料挑特徵時，測試資料的 y 已經影響了特徵的選擇，測試分數會過度樂觀。所有會「看資料」的步驟（標準化、補值、特徵選擇）都要只用訓練資料做。"},{"n":98,"t":"met","s":"5 折交叉驗證（5-Fold Cross-Validation）中，每一筆資料會被拿來當驗證資料幾次？每次訓練用多少比例的資料？","o":["5 次；每次用 20% 的資料訓練","1 次；每次用 20% 的資料訓練","1 次；每次用 80% 的資料訓練","0 次；全部都拿來訓練"],"a":2,"e":"資料分成 5 份，輪流拿 1 份當驗證、其餘 4 份（80%）訓練，每筆資料剛好當過一次驗證資料，最後把 5 次的分數取平均。"},{"n":99,"t":"met","s":"用測試集反覆比較、挑出表現最好的超參數，最後回報這個測試分數，會有什麼問題？","o":["沒有任何問題","測試分數會過度樂觀，因為測試集已經被拿來選模型，不再是沒看過的資料","測試分數會過度悲觀","模型會自動欠擬合"],"a":1,"e":"選超參數應該用驗證集或交叉驗證；測試集只在最後用一次。反覆用測試集挑選，等於把測試集也拿來「訓練」選擇過程。"},{"n":100,"t":"met","s":"用歷史股價做預測，為什麼交叉驗證不能把資料隨機打亂？","o":["打亂後會用到未來的資料來預測過去，評估結果過度樂觀；要依時間順序，用過去訓練、未來驗證","打亂會讓資料變少","打亂後無法計算 MSE","時間序列不需要驗證"],"a":0,"e":"隨機切分會讓訓練集包含驗證期之後的資料，模型等於偷看了未來。時間序列要依時間往前滾動切分。","x":1}]};
const KEY = "aiot-quiz1-advanced-v1";
const L = "ABCD";
let state = { mode: "practice", topic: "all", wrongOnly: false, hideExt: false, picks: {} };
try { Object.assign(state, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
// 2026-11：這 10 題換成新題目，清掉舊題目的作答紀錄（其他題保留）
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const topicName = Object.fromEntries(DATA.topics.map(t => [t.k, t]));
const $ = id => document.getElementById(id);

const pool = () => DATA.items.filter(it => !(state.hideExt && it.x));

function renderChips() {
  const counts = {};
  pool().forEach(it => counts[it.t] = (counts[it.t] || 0) + 1);
  const all = [{ k: "all", zh: "全部", n: pool().length }].concat(DATA.topics.map(t => ({ k: t.k, zh: t.zh, n: counts[t.k] })));
  $("chips").innerHTML = all.map(t =>
    `<button type="button" class="chip" data-topic="${t.k}" aria-pressed="${state.topic === t.k}">${esc(t.zh)}<small>${t.n}</small></button>`).join("");
}

function card(it) {
  const pick = state.picks[it.n];
  const answered = pick !== undefined;
  const show = state.mode === "review" || answered;
  const opts = it.o.map((o, j) => {
    let cls = "opt";
    if (show && j === it.a) cls += " ok";
    if (state.mode === "practice" && answered && j === pick && pick !== it.a) cls += " no";
    const dis = state.mode === "review" || answered ? " disabled" : "";
    return `<button type="button" class="${cls}" data-q="${it.n}" data-j="${j}"${dis}><span class="k">${L[j]}.</span><span>${esc(o)}</span></button>`;
  }).join("");
  let ans = "";
  if (show) {
    const verdict = state.mode === "practice" && answered
      ? (pick === it.a ? "答對了。" : `<span class="wrong">你選 ${L[pick]}，答錯了。</span>`) : "";
    ans = `<div class="ans">${verdict}<b>答案：${L[it.a]}</b><br>解析：${esc(it.e)}</div>`;
  }
  return `<article class="q${it.x ? " x" : ""}" id="q${it.n}"><h3><span class="no">${it.n}</span><span>${it.x ? '<span class="ext">延伸</span>' : ""}${esc(it.s)}</span></h3><div class="opts">${opts}</div>${ans}</article>`;
}

function render() {
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === state.mode));
  $("wrongOnly").setAttribute("aria-pressed", state.wrongOnly);
  $("wrongOnly").hidden = state.mode !== "practice";
  $("hideExt").setAttribute("aria-pressed", state.hideExt);
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.topic === state.topic));

  let items = pool().filter(it => state.topic === "all" || it.t === state.topic);
  if (state.mode === "practice" && state.wrongOnly) items = items.filter(it => state.picks[it.n] !== undefined && state.picks[it.n] !== it.a);

  let html = "", cur = null;
  for (const it of items) {
    if (it.t !== cur) {
      cur = it.t;
      const t = topicName[cur];
      html += `<h2 class="sec-title">${esc(t.zh)}<span>${esc(t.en)}</span></h2>`;
    }
    html += card(it);
  }
  $("list").innerHTML = html || `<p class="empty">${state.wrongOnly ? "目前沒有答錯的題目。" : "沒有題目。"}</p>`;
  renderScore();
}

function renderScore() {
  const scope = pool().filter(it => state.topic === "all" || it.t === state.topic);
  const done = scope.filter(it => state.picks[it.n] !== undefined);
  const right = done.filter(it => state.picks[it.n] === it.a).length;
  const pct = done.length ? Math.round(right / done.length * 100) : 0;
  $("score").innerHTML = `答對 <b>${right}</b> / 已答 <b>${done.length}</b> / 共 ${scope.length}` + (done.length ? `（${pct}%）` : "");
}

document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.mode) { state.mode = b.dataset.mode; save(); render(); }
  else if (b.dataset.topic) { state.topic = b.dataset.topic; save(); render(); window.scrollTo({ top: $("list").offsetTop - 140 }); }
  else if (b.id === "wrongOnly") { state.wrongOnly = !state.wrongOnly; save(); render(); }
  else if (b.id === "hideExt") { state.hideExt = !state.hideExt; save(); renderChips(); render(); }
  else if (b.id === "reset") {
    if (confirm("清除所有作答紀錄？")) { state.picks = {}; state.wrongOnly = false; save(); render(); }
  }
  else if (b.dataset.q) {
    const n = +b.dataset.q, it = DATA.items[n - 1];
    state.picks[n] = +b.dataset.j; save();
    document.getElementById("q" + n).outerHTML = card(it);
    renderScore();
  }
});

renderChips();
render();
</script>
</body>
</html>
