<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChatGPT 考題專區</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Same lab-notebook palette as the Quiz 1 study page; a sticky toolbar carries mode, score and topic filter, questions are one column of cards */
:root {
  --bg: #f4f6f8; --surface: #ffffff; --fg: #17212b; --muted: #5a6876; --line: #d9e0e7;
  --accent: #1c6b86; --accent-soft: #e2eff4; --code-bg: #eef2f5; --mark: #b4541f;
  --good: #2f7a4a; --good-soft: #e3f2e8; --bad: #b23b3b; --bad-soft: #f8e5e5;
  --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1317; --surface: #151c22; --fg: #e2e8ee; --muted: #94a2af; --line: #263139;
    --accent: #63b5d2; --accent-soft: #15303a; --code-bg: #1a232b; --mark: #e39a6c;
    --good: #7cc89a; --good-soft: #15291d; --bad: #ec8b8b; --bad-soft: #351a1a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1317; --surface: #151c22; --fg: #e2e8ee; --muted: #94a2af; --line: #263139;
  --accent: #63b5d2; --accent-soft: #15303a; --code-bg: #1a232b; --mark: #e39a6c;
  --good: #7cc89a; --good-soft: #15291d; --bad: #ec8b8b; --bad-soft: #351a1a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: 64px;
}
a { color: var(--accent); text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 820px; margin: 0 auto; }

.mast { padding-block: 40px 18px; }
.eyebrow { font-size: 13px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
h1 { font-family: var(--font-display); font-weight: 900; font-size: clamp(28px, 5vw, 40px); line-height: 1.25; margin: 6px 0 10px; text-wrap: balance; }
.mast p { margin: 0; color: var(--muted); max-width: 64ch; }

.bar {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: 12px 0 10px; border-bottom: 1px solid var(--line);
  display: grid; gap: 10px;
}
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 5px 14px; cursor: pointer; font-size: 14px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); font-weight: 700; }
.score { font-family: var(--font-mono); font-size: 14px; color: var(--muted); margin-left: auto; white-space: nowrap; }
.score b { color: var(--fg); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 12px; cursor: pointer; font-size: 14px; }
.btn[aria-pressed="true"] { border-color: var(--bad); color: var(--bad); font-weight: 700; }
:root { --extc: #1d4ed8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --extc: #8fb0ff; } }
:root[data-theme="dark"] { --extc: #8fb0ff; }
.q.x h3 > span:last-child, .q.x .opt span:last-child { color: var(--extc); }
.ext { display: inline-block; font-size: 12px; font-weight: 600; color: var(--extc); border: 1px solid var(--extc); border-radius: 6px; padding: 0 6px; margin-right: 6px; vertical-align: 2px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.chip { flex: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 11px; background: var(--surface); cursor: pointer; font-size: 13.5px; color: var(--muted); white-space: nowrap; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--fg); font-weight: 700; }
.chip small { font-family: var(--font-mono); margin-left: 4px; }

.sec-title { font-family: var(--font-display); font-size: 21px; margin: 34px 0 6px; padding-bottom: 6px; border-bottom: 2px solid var(--accent); }
.sec-title span { font-family: var(--font-body); font-size: 14px; color: var(--muted); font-weight: 400; margin-left: 8px; }

.q { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-top: 14px; }
.q h3 { font-size: 16.5px; line-height: 1.6; margin: 0 0 10px; font-weight: 700; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; }
.q h3 .no { font-family: var(--font-mono); color: var(--accent); font-weight: 600; }
.opts { display: grid; gap: 6px; }
.opt { display: grid; grid-template-columns: 1.6em minmax(0, 1fr); gap: 6px; text-align: left; border: 1px solid var(--line); background: none; border-radius: 8px; padding: 7px 12px; cursor: pointer; line-height: 1.6; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt:disabled { cursor: default; }
.opt .k { font-family: var(--font-mono); font-weight: 600; color: var(--muted); }
.opt.ok { border-color: var(--good); background: var(--good-soft); font-weight: 700; }
.opt.ok .k { color: var(--good); }
.opt.no { border-color: var(--bad); background: var(--bad-soft); }
.opt.no .k { color: var(--bad); }
.ans { margin-top: 10px; padding: 9px 14px; border-left: 3px solid var(--accent); background: var(--code-bg); border-radius: 0 8px 8px 0; font-size: 15px; }
.ans b { color: var(--good); }
.ans .wrong { color: var(--bad); font-weight: 700; }
.empty { color: var(--muted); text-align: center; padding: 48px 0; }
.foot { margin-top: 40px; font-size: 14px; color: var(--muted); }
@media (max-width: 560px) {
  .score { margin-left: 0; width: 100%; }
  .q { padding: 14px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="eyebrow">AIoT-DA · Quiz 1 準備</div>
    <h1>ChatGPT 考題專區：100 題</h1>
    <p>這份題目由 ChatGPT 產生，獨立於 <a href="quiz1-question-bank.html">Claude 整理的 209 題題庫</a>，作答紀錄也分開記。ChatGPT 只出了線性迴歸、邏輯斯迴歸、決策樹三個主題。整理時更正了第 16 題的答案（原答案 C 有誤），並把第 74、76、90、94～98 題的程式名稱改成觀念說法。</p>
  </header>

  <div class="bar">
    <div class="row">
      <div class="seg" role="group" aria-label="模式">
        <button type="button" data-mode="practice">練習</button>
        <button type="button" data-mode="review">看答案</button>
      </div>
      <button type="button" class="btn" id="wrongOnly" aria-pressed="false">只看答錯</button>
      <button type="button" class="btn" id="hideExt" aria-pressed="false" title="延伸題：老師課程資料沒有提到的觀念">隱藏延伸題</button>
      <button type="button" class="btn" id="reset">重設作答</button>
      <div class="score" id="score"></div>
    </div>
    <div class="chips" id="chips" role="group" aria-label="主題"></div>
  </div>

  <main id="list"></main>
  <p class="foot">題目由 ChatGPT 產生，非老師公布的官方題目；答案與解析經 Claude 檢查。藍色、標「延伸」的題目考的是老師課程資料（L05～L07、Notion 範圍頁）沒有提到的延伸觀念。</p>
</div>

<script>
const DATA = {"topics":[{"k":"lin","zh":"線性迴歸","en":"Linear Regression"},{"k":"log","zh":"邏輯斯迴歸","en":"Logistic Regression"},{"k":"dt","zh":"決策樹","en":"Decision Tree"}],"items":[{"n":1,"t":"lin","s":"線性迴歸（Linear Regression）的主要目標是什麼？","o":["最大化輸入特徵的變異數","最小化模型使用的特徵數量","最大化分類準確率（Accuracy）","最小化殘差平方和（Sum of Squared Errors, SSE）"],"a":3,"e":"普通最小平方法（OLS）透過最小化實際值與預測值之間的平方誤差，求出最佳迴歸係數。"},{"n":2,"t":"lin","s":"下列何者是多元線性迴歸（Multiple Linear Regression）的數學模型？","o":["ŷ = log(x)","ŷ = σ(wᵀx + b)","ŷ = b + w₁x₁ + w₂x₂ + ⋯ + wₚxₚ","ŷ = arg max P(y | x)"],"a":2,"e":"多元線性迴歸利用多個輸入特徵的線性組合預測連續數值。"},{"n":3,"t":"lin","s":"線性迴歸中的係數（Coefficient）代表什麼？","o":["模型的分類準確率","在其他變數固定下，特徵增加一單位時，預測值的平均變化量","資料集的總筆數","模型訓練所需時間"],"a":1,"e":"迴歸係數代表特徵與目標變數之間的線性關係，解讀時需要考慮其他變數固定的條件。"},{"n":4,"t":"lin","s":"線性迴歸中的截距（Intercept）代表什麼？","o":["當所有輸入特徵為 0 時，模型預測的目標值","模型的預測誤差","所有特徵的平均值","模型的最大預測值"],"a":0,"e":"截距 b₀ 是模型在所有特徵為零時的預測值。"},{"n":5,"t":"lin","s":"殘差（Residual）應如何計算？","o":["實際值 + 預測值","預測值 − 平均值","預測值 × 實際值","實際值 − 預測值"],"a":3,"e":"殘差表示實際觀測值與模型預測值之間的差距。"},{"n":6,"t":"lin","s":"下列哪一項最符合線性迴歸的預測目標？","o":["預測電子郵件是否為垃圾郵件","預測病患是否罹患疾病","預測房屋的市場價格","預測圖片中的物件類別"],"a":2,"e":"房價是連續數值，適合使用迴歸模型預測。"},{"n":7,"t":"lin","s":"普通最小平方法（OLS）主要最小化哪一項？","o":["分類錯誤數量","殘差平方和","特徵數量","絕對誤差總和"],"a":1,"e":"OLS 透過平方誤差懲罰較大的預測偏差。"},{"n":8,"t":"lin","s":"下列哪一項是線性迴歸的目標變數（Target Variable）？","o":["模型希望預測的結果","模型的訓練時間","模型的超參數","用來預測的輸入欄位"],"a":0,"e":"目標變數是模型學習時希望預測的 y。"},{"n":9,"t":"lin","s":"單變數線性迴歸（Simple Linear Regression）具有幾個輸入特徵？","o":["2 個","不限數量","0 個","1 個"],"a":3,"e":"單變數線性迴歸只有一個自變數。"},{"n":10,"t":"lin","s":"多元線性迴歸與單變數線性迴歸最大的差異為何？","o":["多元線性迴歸不需要計算誤差","多元線性迴歸只能預測分類","多元線性迴歸可以使用多個輸入特徵","多元線性迴歸不需要訓練資料"],"a":2,"e":"兩者主要差異在輸入特徵數量。"},{"n":11,"t":"lin","s":"均方誤差（Mean Squared Error, MSE）如何計算？","o":["(1/n) Σ|yᵢ − ŷᵢ|","(1/n) Σ(yᵢ − ŷᵢ)²","Σ(yᵢ + ŷᵢ)","(1/n) Σyᵢ"],"a":1,"e":"MSE 計算每筆預測誤差的平方，再取平均值。"},{"n":12,"t":"lin","s":"MSE 對較大的預測誤差有什麼特性？","o":["因為平方運算，會給予較大的誤差更高懲罰","只計算正向誤差","忽略較大的誤差","與誤差呈線性關係"],"a":0,"e":"誤差平方會放大離群預測的影響。"},{"n":13,"t":"lin","s":"平均絕對誤差（Mean Absolute Error, MAE）的計算方式為何？","o":["(1/n) Σ(yᵢ − ŷᵢ)²","Σyᵢ / n","Σŷᵢ / n","(1/n) Σ|yᵢ − ŷᵢ|"],"a":3,"e":"MAE 計算預測誤差的絕對值平均，不會像 MSE 一樣平方放大誤差。"},{"n":14,"t":"lin","s":"RMSE（Root Mean Squared Error）與 MSE 的關係為何？","o":["RMSE 與 MSE 完全無關","RMSE 是 MSE 的平方","RMSE 是 MSE 的平方根","RMSE 是 MSE 的倒數"],"a":2,"e":"RMSE 可以讓誤差回到原始目標變數的單位。"},{"n":15,"t":"lin","s":"決定係數（R²）主要用來衡量什麼？","o":["特徵之間的相關性","模型解釋目標變數變異程度的能力","模型使用的特徵數量","模型的訓練速度"],"a":1,"e":"R² 衡量模型相較於以目標變數平均值預測的基準模型，解釋了多少變異。"},{"n":16,"t":"lin","s":"一般含截距的 OLS 模型，在訓練資料上的 R² 可能為多少？","o":["只能介於 0 和 1","一定等於 1","不大於 1，但可能小於 0","一定大於 0"],"a":0,"e":"含截距的 OLS 在自己的訓練資料上滿足 SST = SSR + SSE，所以 R² = SSR ÷ SST 一定介於 0 和 1 之間（可以等於 0 或 1）。R² 會小於 0 的情況是在測試資料上，或模型不是含截距的 OLS、表現比直接猜平均值還差時。（ChatGPT 原答案是「不大於 1，但可能小於 0」，有誤，已更正為「只能介於 0 和 1」。）"},{"n":17,"t":"lin","s":"當 MSE 等於 0 時，代表什麼？","o":["模型一定發生過擬合","模型沒有進行訓練","模型完全沒有預測能力","所有訓練資料的預測值都等於實際值"],"a":3,"e":"MSE 為零表示所有樣本的預測誤差均為零，但不代表模型在未知資料上也能正確預測。"},{"n":18,"t":"lin","s":"假設模型 A 的 RMSE 為 5，模型 B 的 RMSE 為 10，在相同測試資料及相同目標尺度下，哪個模型較好？","o":["兩者一定相同","無法根據 RMSE 比較","模型 A","模型 B"],"a":2,"e":"RMSE 越低，代表預測誤差通常越小。"},{"n":19,"t":"lin","s":"如果資料存在極端離群值（Outliers），哪一個指標通常較容易受到影響？","o":["MAE","MSE","Median Absolute Error","三者完全相同"],"a":1,"e":"MSE 對誤差平方，因此極端誤差可能大幅提高指標數值。"},{"n":20,"t":"lin","s":"當模型的 R² 從 0.6 提升至 0.9，通常代表什麼？","o":["模型對目標變數變異的解釋程度提高","模型一定沒有過擬合","模型的特徵數量減少","模型的預測誤差一定變成零"],"a":0,"e":"R² 提高通常代表模型對資料的解釋能力提升，但仍須檢查測試集表現。"},{"n":21,"t":"lin","s":"線性迴歸的重要假設之一為何？","o":["所有資料必須是文字","所有目標值必須大於零","所有特徵必須完全相同","模型對參數具有線性關係"],"a":3,"e":"線性迴歸假設條件平均數可以由參數的線性組合表示，不代表每個原始特徵都只能呈現直線關係。"},{"n":22,"t":"lin","s":"同方差性（Homoscedasticity）代表什麼？","o":["每個特徵的平均值相同","特徵之間沒有相關性","誤差的條件變異數維持固定","預測值永遠等於實際值"],"a":2,"e":"同方差性是傳統線性迴歸推論的重要假設。"},{"n":23,"t":"lin","s":"多重共線性（Multicollinearity）代表什麼？","o":["目標變數有大量缺失值","兩個或多個輸入特徵之間存在高度線性關係","訓練資料全部重複","模型沒有截距"],"a":1,"e":"多重共線性可能導致係數估計不穩定，增加標準誤。"},{"n":24,"t":"lin","s":"下列哪一種方法可以協助檢測多重共線性？","o":["Variance Inflation Factor（VIF）","Recall","Confusion Matrix","Accuracy"],"a":0,"e":"VIF 用來評估某個特徵能被其他特徵解釋的程度。","x":1},{"n":25,"t":"lin","s":"當線性迴歸模型出現異質變異性（Heteroscedasticity），可能造成什麼問題？","o":["所有預測值都變成零","模型自動變成分類模型","模型一定無法計算係數","傳統標準誤與統計推論可能不可靠"],"a":3,"e":"可以考慮異質變異穩健標準誤（Robust Standard Errors）等方法。","x":1},{"n":26,"t":"lin","s":"為什麼線性迴歸需要將資料區分為訓練集與測試集？","o":["增加資料欄位","減少資料筆數","評估模型對未知資料的泛化能力","讓模型一定取得 100% 準確率"],"a":2,"e":"測試集用來評估模型在未參與訓練資料上的表現。"},{"n":27,"t":"lin","s":"交叉驗證（Cross Validation）的主要目的為何？","o":["讓資料全部變成訓練集","透過多次資料切分評估模型的穩定性與泛化能力","直接增加模型參數","取代所有測試資料"],"a":1,"e":"K-Fold Cross Validation 將資料分成 K 份，輪流使用不同資料作為驗證集。"},{"n":28,"t":"lin","s":"當線性迴歸模型在訓練集表現很好，但測試集表現很差，最可能發生什麼問題？","o":["Overfitting（過擬合）","資料完全沒有特徵","模型沒有使用損失函數","Underfitting（欠擬合）"],"a":0,"e":"過擬合代表模型過度學習訓練資料中的特定模式，導致泛化能力下降。"},{"n":29,"t":"lin","s":"Ridge Regression 使用哪一種正則化？","o":["L1 正則化","不使用正則化","L0 正則化","L2 正則化"],"a":3,"e":"Ridge 對係數平方和施加懲罰，降低係數過大的風險。"},{"n":30,"t":"lin","s":"Lasso Regression 使用哪一種正則化？","o":["L0 正則化","Softmax 正則化","L1 正則化","L2 正則化"],"a":2,"e":"Lasso 對係數絕對值總和施加懲罰，可能將部分係數壓縮至零。"},{"n":31,"t":"lin","s":"Ridge Regression 與 Lasso Regression 最大的差異為何？","o":["Ridge 用於分類，Lasso 用於迴歸","Ridge 通常縮小係數但不會將係數精確壓成零；Lasso 可以進行特徵選擇","Ridge 不需要訓練，Lasso 需要訓練","兩者完全相同"],"a":1,"e":"Lasso 的 L1 懲罰具有稀疏化效果，有機會移除不重要的特徵。"},{"n":32,"t":"lin","s":"正則化參數（Regularization Parameter，λ，有些教材寫成 α）增加時，通常會發生什麼事？","o":["模型係數受到更強的懲罰","訓練誤差一定降低","特徵數量一定增加","模型複雜度一定增加"],"a":0,"e":"較強的正則化通常會限制模型複雜度，但過大可能造成欠擬合。"},{"n":33,"t":"lin","s":"為什麼 Ridge 與 Lasso 通常建議搭配特徵標準化（Standardization）？","o":["讓模型不需要計算係數","讓所有目標值變成零","增加資料集筆數","避免不同尺度的特徵在正則化時受到不公平的影響"],"a":3,"e":"標準化可以讓特徵尺度較一致，使係數懲罰更合理。"},{"n":34,"t":"lin","s":"使用線性迴歸進行研究時，下列哪一項最值得注意？","o":["只要 R² 高就代表模型完全正確","只需要檢查訓練集","除了預測能力，也需要檢查模型假設、殘差與泛化能力","特徵越多，模型一定越好"],"a":2,"e":"研究不能只看單一指標，還應檢查殘差分布、共線性、資料偏差及測試集表現。"},{"n":35,"t":"log","s":"邏輯斯迴歸（Logistic Regression）主要用於哪一種機器學習任務？","o":["預測房屋價格","分類問題（Classification）","資料壓縮","無監督式分群"],"a":1,"e":"Logistic Regression 雖然名稱有 Regression，但主要用於分類任務，尤其是二元分類。"},{"n":36,"t":"log","s":"Logistic Regression 最常使用哪一種函數將線性輸出轉換成機率？","o":["Sigmoid","Softplus","ReLU","Tanh"],"a":0,"e":"Sigmoid 函數可以將任意實數轉換成 0～1 之間的數值。"},{"n":37,"t":"log","s":"Sigmoid 函數的輸出範圍為何？","o":["0 到正無限大","負無限大到正無限大","−1 到 1","0 到 1（不包含端點）"],"a":3,"e":"Sigmoid 的輸出可以解讀為二元分類中正類別的預測機率。"},{"n":38,"t":"log","s":"下列哪一個是 Sigmoid 函數的公式？","o":["f(x) = log(x)","f(x) = x²","σ(z) = 1 ÷ (1 + e⁻ᶻ)","f(x) = max(0, x)"],"a":2,"e":"Sigmoid 將線性模型的輸出轉換成機率。"},{"n":39,"t":"log","s":"Logistic Regression 的線性部分通常為何？","o":["z = x² + b","z = wᵀx + b","z = log(x)","z = max(x, 0)"],"a":1,"e":"先計算特徵與權重的線性組合，再透過 Sigmoid 轉換成機率。"},{"n":40,"t":"log","s":"Logistic Regression 預測機率為 0.85，代表什麼？","o":["模型估計該樣本屬於正類別的機率為 85%","模型有 85% 的訓練資料","模型有 85 個特徵","模型有 85% 的準確率"],"a":0,"e":"預測機率不等於整體模型準確率，也不保證該預測一定正確。"},{"n":41,"t":"log","s":"二元 Logistic Regression 的預測結果通常包含哪兩種類別？","o":["訓練集與測試集","高維度與低維度","連續數值與離散數值","正類別（Positive）與負類別（Negative）"],"a":3,"e":"二元分類通常將結果分成 0 與 1 兩類。"},{"n":42,"t":"log","s":"Logistic Regression 的線性決策邊界（Decision Boundary）通常由什麼決定？","o":["資料集的筆數","模型訓練時間","模型權重與分類閾值","測試集的大小"],"a":2,"e":"決策邊界由模型的線性組合及選定的機率閾值決定。"},{"n":43,"t":"log","s":"當 Logistic Regression 使用 0.5 作為分類閾值時，預測機率為 0.8，結果為何？","o":["預測為負類別","預測為正類別","無法進行分類","一定是錯誤預測"],"a":1,"e":"預測機率大於或等於 0.5 時，通常判定為正類別。"},{"n":44,"t":"log","s":"Logistic Regression 與 Linear Regression 最大的差異為何？","o":["Linear Regression 預測連續數值；Logistic Regression 主要預測類別機率","Logistic Regression 不需要訓練資料","Linear Regression 只能處理二元分類","兩者都只能預測連續數值"],"a":0,"e":"兩者的輸出目標不同，應依據研究任務選擇模型。"},{"n":45,"t":"log","s":"Logistic Regression 最常使用哪一種損失函數？","o":["Sum of Absolute Errors","Euclidean Distance","Mean Squared Error","Binary Cross-Entropy（Binary Log Loss）"],"a":3,"e":"二元交叉熵是二元分類常用的損失函數，用來衡量預測機率與實際標籤的差異。"},{"n":46,"t":"log","s":"Binary Cross-Entropy 的主要目的為何？","o":["計算特徵之間的距離","最小化輸入特徵數量","衡量模型預測機率與真實標籤之間的差異","最大化訓練時間"],"a":2,"e":"預測機率越符合真實標籤，損失通常越低。"},{"n":47,"t":"log","s":"當模型對正類別的實際標籤為 1，卻預測機率只有 0.01，通常會發生什麼事？","o":["模型完全正確","產生較大的交叉熵損失","模型不需要更新參數","損失接近零"],"a":1,"e":"模型對真實正類別給予極低機率時，交叉熵會給予較大懲罰（−ln 0.01 ≈ 4.605）。"},{"n":48,"t":"log","s":"Logistic Regression 通常透過哪一種方法學習模型參數？","o":["Gradient Descent 或數值最佳化方法","Random Sampling Only","K-Means Clustering","Decision Tree Splitting"],"a":0,"e":"常見最佳化方式包含梯度下降法及其變體，也可以使用其他數值最佳化演算法。"},{"n":49,"t":"log","s":"梯度下降法（Gradient Descent）的主要目的為何？","o":["刪除所有輸入特徵","將資料全部分類成正類別","增加損失函數","沿著負梯度方向更新參數，以降低損失函數"],"a":3,"e":"梯度提供損失函數增加最快的方向，因此沿負梯度方向更新參數。"},{"n":50,"t":"log","s":"學習率（Learning Rate）設定過大可能造成什麼問題？","o":["所有權重都會變成零","一定更快找到全域最佳解","更新步伐過大，可能在最佳解附近震盪甚至無法收斂","模型不再需要訓練"],"a":2,"e":"學習率需要適當設定，過大可能導致最佳化不穩定。"},{"n":51,"t":"log","s":"Logistic Regression 中的 Odds 代表什麼？","o":["預測值與平均值的差距","事件發生機率與事件不發生機率的比值","模型的準確率","特徵的標準差"],"a":1,"e":"Odds = p ÷ (1 − p)。例如事件發生機率為 0.8，Odds 就是 0.8 ÷ 0.2 = 4。","x":1},{"n":52,"t":"log","s":"Logistic Regression 中的 Logit 是什麼？","o":["Odds 的自然對數","預測誤差的平均值","機率的平方","模型的準確率"],"a":0,"e":"Logit(p) = ln(p ÷ (1 − p))，把 0～1 的機率轉換成整條實數線。","x":1},{"n":53,"t":"log","s":"Logistic Regression 的係數（Coefficient）為正值，通常代表什麼？","o":["模型一定發生過擬合","該特徵沒有任何影響","特徵增加會使正類別機率一定降低","在其他特徵固定下，該特徵增加會使正類別的 Log-Odds 增加"],"a":3,"e":"正係數表示 Log-Odds 隨特徵增加而增加，但機率的變化仍取決於原本的預測位置。","x":1},{"n":54,"t":"log","s":"Logistic Regression 中，係數取指數 eᵝ 通常代表什麼？","o":["MSE","Accuracy","Odds Ratio（勝算比）","Learning Rate"],"a":2,"e":"當其他變數固定，特徵增加一單位時，Odds 會乘上 eᵝ。","x":1},{"n":55,"t":"log","s":"Accuracy（準確率）的計算公式為何？","o":["TP ÷ (TP + FN)","(TP + TN) ÷ (TP + TN + FP + FN)","FP ÷ (FP + TN)","TP ÷ (TP + FP)"],"a":1,"e":"Accuracy 計算所有預測正確的樣本占總樣本數的比例。"},{"n":56,"t":"log","s":"Precision（精確率）主要衡量什麼？","o":["所有被預測為正類別的樣本中，實際為正類別的比例","所有實際正類別中，被成功找出的比例","所有預測正確的比例","所有實際負類別中，被找出的比例"],"a":0,"e":"Precision = TP ÷ (TP + FP)。Precision 越高，代表誤報（False Positive）通常越少。"},{"n":57,"t":"log","s":"Recall（召回率）主要衡量什麼？","o":["所有負類別預測正確的比例","所有樣本的平均預測機率","預測為正類別的資料中有多少正確","所有實際正類別中，被模型成功找出的比例"],"a":3,"e":"Recall = TP ÷ (TP + FN)。Recall 越高，代表漏掉的正類別（False Negative）通常越少。"},{"n":58,"t":"log","s":"F1-Score 的主要特性為何？","o":["只考慮 Accuracy","只考慮 Precision","是 Precision 與 Recall 的調和平均數","是 Precision 與 Recall 的算術平均數"],"a":2,"e":"F1 = 2 × Precision × Recall ÷ (Precision + Recall)，適合用來兼顧 Precision 與 Recall。"},{"n":59,"t":"log","s":"True Positive（TP）代表什麼？","o":["實際負類別，預測為正類別","實際正類別，預測為正類別","實際正類別，預測為負類別","實際負類別，預測為負類別"],"a":1,"e":"TP 是模型正確辨識出的正類別。"},{"n":60,"t":"log","s":"False Positive（FP）代表什麼？","o":["實際負類別，卻被預測為正類別","實際正類別，預測為正類別","實際正類別，預測為負類別","實際負類別，預測為負類別"],"a":0,"e":"FP 又稱為誤報（False Alarm）。"},{"n":61,"t":"log","s":"False Negative（FN）代表什麼？","o":["實際負類別，預測為負類別","實際負類別，預測為正類別","實際正類別，預測為正類別","實際正類別，卻被預測為負類別"],"a":3,"e":"FN 又稱漏報（Miss），在疾病篩檢及資安威脅偵測中可能造成嚴重影響。"},{"n":62,"t":"log","s":"當資料集高度不平衡（Imbalanced Dataset）時，只使用 Accuracy 評估模型有什麼風險？","o":["Accuracy 一定等於 F1-Score","Accuracy 一定無法計算","即使模型只預測多數類別，也可能得到很高的 Accuracy","Accuracy 會自動變成 Recall"],"a":2,"e":"例如 10,000 筆資料只有 100 筆正類別，全部預測為負類別仍有 99% Accuracy，但完全找不到正類別。"},{"n":63,"t":"log","s":"ROC-AUC 主要用來評估什麼？","o":["模型使用的特徵數量","模型區分正類別與負類別的能力","模型的資料儲存容量","模型訓練速度"],"a":1,"e":"ROC 曲線呈現不同閾值下的 True Positive Rate 與 False Positive Rate；AUC 越高，通常代表區分能力越好。"},{"n":64,"t":"log","s":"當分類問題的正類別非常少時，若研究目標是盡量找出所有正類別，應優先關注哪一項指標？","o":["Recall","Training Time","Accuracy","Specificity"],"a":0,"e":"Recall 越高，代表漏掉的正類別越少，但也要注意可能增加誤報。"},{"n":65,"t":"log","s":"調整分類閾值（Threshold）從 0.5 降低至 0.3，通常會產生什麼影響？","o":["模型權重一定變成零","訓練資料會自動增加","預測為正類別的樣本一定減少","預測為正類別的樣本通常增加，Recall 可能提高，但 Precision 可能下降"],"a":3,"e":"降低閾值會讓更多樣本被判定為正類別，通常可以降低漏報，但也可能增加誤報。","x":1},{"n":66,"t":"log","s":"多元 Logistic Regression（Multinomial Logistic Regression）主要用於什麼情境？","o":["只預測連續數值","只能處理兩個特徵","預測三個或以上的互斥類別","只能進行無監督式分群"],"a":2,"e":"Multinomial Logistic Regression 可以處理多類別分類，例如預測交通工具為汽車、公車或機車。","x":1},{"n":67,"t":"log","s":"進行 Logistic Regression 研究時，為什麼需要注意機率校準（Probability Calibration）？","o":["因為模型必須將所有機率預測為 0.5","因為預測機率應盡可能反映實際事件發生頻率","因為校準可以直接刪除所有錯誤資料","因為 Accuracy 一定等於機率校準"],"a":1,"e":"例如模型預測 100 筆樣本的事件機率約為 0.8，理想情況下這群樣本約有 80% 真正發生事件。校準對風險評估及決策研究很重要。","x":1},{"n":68,"t":"dt","s":"決策樹（Decision Tree）的主要運作方式為何？","o":["透過特徵條件進行資料分割，逐步建立預測規則","計算所有樣本的平均距離","將資料轉換成機率分布","透過神經網路傳遞訊號"],"a":0,"e":"決策樹透過條件判斷將資料切分成不同群組，最後在葉節點產生預測結果。"},{"n":69,"t":"dt","s":"決策樹中，Root Node（根節點）代表什麼？","o":["樹的最深層節點","模型的損失函數","最後預測結果","決策樹最上層的起始節點"],"a":3,"e":"Root Node 是整棵決策樹的起點，通常包含全部訓練樣本。"},{"n":70,"t":"dt","s":"決策樹中的 Leaf Node（葉節點）代表什麼？","o":["第一個特徵","資料分割條件","最終預測結果所在的節點","模型的訓練參數"],"a":2,"e":"分類樹的葉節點通常輸出類別或類別機率；迴歸樹則輸出連續數值。"},{"n":71,"t":"dt","s":"決策樹中的 Internal Node（內部節點）主要負責什麼？","o":["儲存模型的最終準確率","根據特徵條件進行資料分割","計算模型的訓練時間","刪除所有訓練資料"],"a":1,"e":"內部節點會依據特徵及分割條件，將資料導向不同分支。"},{"n":72,"t":"dt","s":"決策樹中的 Branch（分支）代表什麼？","o":["節點分割後的不同判斷路徑","模型的訓練資料","特徵的平均值","模型的預測誤差"],"a":0,"e":"分支代表條件判斷後的資料流向。"},{"n":73,"t":"dt","s":"決策樹最大的優勢之一為何？","o":["不可能發生過擬合","一定比所有演算法準確","不需要任何訓練資料","容易解釋，能以規則方式呈現預測邏輯"],"a":3,"e":"決策樹可以視覺化呈現判斷條件，因此在需要解釋模型決策的研究中很有價值。"},{"n":74,"t":"dt","s":"決策樹可以處理哪一種任務？","o":["只能進行分類","只能進行迴歸","分類與迴歸","只能進行無監督式學習"],"a":2,"e":"分類樹用於分類；迴歸樹用於預測連續數值。"},{"n":75,"t":"dt","s":"決策樹在分類問題中，葉節點通常如何決定預測類別？","o":["隨機選擇類別","通常依據葉節點中樣本數最多的類別","選擇特徵數量最多的類別","選擇資料集第一筆資料的類別"],"a":1,"e":"常見分類樹會使用多數決方式決定葉節點的預測類別。"},{"n":76,"t":"dt","s":"決策樹在迴歸問題中，葉節點通常如何產生預測值？","o":["使用該葉節點訓練樣本目標值的平均數（常見設定）","使用所有特徵的最大值","使用隨機數值","使用類別投票"],"a":0,"e":"迴歸樹常以葉節點內訓練樣本的目標值平均數作為預測值。","x":1},{"n":77,"t":"dt","s":"決策樹是否需要特徵標準化（Standardization）？","o":["只能使用 Min-Max Scaling","只能使用 Z-Score","一定需要","一般不需要"],"a":3,"e":"決策樹主要依照特徵切分條件進行判斷，通常不受特徵尺度影響。"},{"n":78,"t":"dt","s":"Entropy（熵）在決策樹中主要衡量什麼？","o":["特徵的最大值","資料集的總筆數","節點內類別的不確定性或混亂程度","模型訓練速度"],"a":2,"e":"Entropy 越高，代表節點內的類別分布通常越混雜；越低則代表類別越集中。"},{"n":79,"t":"dt","s":"當一個分類節點的所有樣本都屬於同一個類別時，Entropy 為多少？","o":["無限大","0","0.5","1"],"a":1,"e":"節點內沒有類別不確定性，因此熵為零。"},{"n":80,"t":"dt","s":"當二元分類節點中，兩個類別的比例各為 50% 時，Entropy 會如何？","o":["達到最大值 1（以 log₂ 為底）","等於 −1","無法計算","等於 0"],"a":0,"e":"二元分類在兩類比例相同時，類別不確定性最高。"},{"n":81,"t":"dt","s":"Information Gain（資訊增益）的主要用途為何？","o":["計算模型的執行時間","增加模型的訓練資料","計算預測值與實際值的差距","衡量特徵分割前後的不確定性減少程度"],"a":3,"e":"資訊增益越高，代表該次分割能夠降低越多的不確定性。"},{"n":82,"t":"dt","s":"Information Gain 的計算概念為何？","o":["預測值 − 實際值","分割後的熵 − 分割前的熵","分割前的熵 − 分割後的加權平均熵","訓練準確率 − 測試準確率"],"a":2,"e":"IG = H(parent) − Σⱼ (Nⱼ ÷ N) · H(childⱼ)，其中 Nⱼ ÷ N 是各子節點的樣本比例。"},{"n":83,"t":"dt","s":"假設一個節點的 Entropy 為 1，分割後的加權平均 Entropy 為 0.3，Information Gain 為多少？","o":["0.3","0.7","−0.7","1.3"],"a":1,"e":"資訊增益 = 1 − 0.3 = 0.7。"},{"n":84,"t":"dt","s":"Gini Impurity（基尼不純度）主要用來衡量什麼？","o":["節點內類別分布的不純程度","模型的執行速度","目標變數的平均值","特徵的相關性"],"a":0,"e":"Gini 是決策樹常見的節點分割評估指標，數值越低通常代表節點越純。"},{"n":85,"t":"dt","s":"Gini Impurity 的公式為何？","o":["−Σᵢ pᵢ log(pᵢ)","Σᵢ pᵢ","Σᵢ pᵢ²","1 − Σᵢ pᵢ²"],"a":3,"e":"Gini 以各類別比例的平方和計算不純度。"},{"n":86,"t":"dt","s":"當一個節點中的所有樣本都屬於同一類別時，Gini Impurity 為多少？","o":["0.5","1","0","0.25"],"a":2,"e":"所有樣本都屬於同一類別，代表沒有分類混亂。"},{"n":87,"t":"dt","s":"二元分類節點中，兩個類別的比例各為 50%，Gini Impurity 為多少？","o":["0","0.5","1","2"],"a":1,"e":"Gini = 1 − (0.5² + 0.5²) = 0.5，這是二元分類下的最大 Gini 不純度。"},{"n":88,"t":"dt","s":"Entropy 與 Gini Impurity 的主要共同點為何？","o":["兩者都能衡量節點內類別的不純程度，並協助選擇分割方式","兩者都不需要標籤資料","兩者只能用於迴歸","兩者都是分類準確率"],"a":0,"e":"兩者都是決策樹常見的分割準則，但計算公式不同。"},{"n":89,"t":"dt","s":"決策樹為什麼容易發生過擬合（Overfitting）？","o":["因為模型不支援分類","因為模型不需要任何特徵","因為模型只能建立一個節點","因為樹可能不斷分割，學習訓練資料中的雜訊與細節"],"a":3,"e":"決策樹如果沒有適當限制，可能建立非常深且複雜的樹。"},{"n":90,"t":"dt","s":"下列哪一種方式可以降低決策樹的過擬合？","o":["無限制增加樹的深度","增加所有節點的分割次數","限制最大深度（Maximum Depth）","移除所有測試資料"],"a":2,"e":"限制樹的深度可以降低模型複雜度，改善泛化能力。"},{"n":91,"t":"dt","s":"Pruning（剪枝）的主要目的為何？","o":["增加決策樹的深度","移除不必要的分支，降低模型複雜度與過擬合風險","增加訓練資料","將分類模型轉換成迴歸模型"],"a":1,"e":"剪枝可以移除對泛化能力幫助有限的分支。"},{"n":92,"t":"dt","s":"Pre-pruning（預剪枝）代表什麼？","o":["在建立決策樹的過程中，提前限制分割條件","將測試資料刪除","只保留最深層節點","完成整棵樹後才開始剪枝"],"a":0,"e":"例如設定最大深度、最小分割樣本數等條件，提前停止分割。"},{"n":93,"t":"dt","s":"Post-pruning（後剪枝）代表什麼？","o":["只調整模型的學習率","在建立樹之前刪除資料","不進行任何分割","先建立較完整的決策樹，再移除不必要的分支"],"a":3,"e":"後剪枝先建立樹，再透過評估決定哪些分支應該移除。"},{"n":94,"t":"dt","s":"決策樹的「最大深度」（Maximum Depth）超參數代表什麼？","o":["模型的最大準確率","最大特徵數量","決策樹允許的最大深度","最大訓練資料筆數"],"a":2,"e":"限制最大深度可以控制樹的複雜度。"},{"n":95,"t":"dt","s":"決策樹的「節點最少分割樣本數」超參數代表什麼？","o":["葉節點必須包含的最小樣本數","一個節點至少需要多少樣本才允許繼續分割","模型至少要有多少個特徵","測試集的最小樣本數"],"a":1,"e":"設定較大的值，通常會減少樹的分割次數。"},{"n":96,"t":"dt","s":"分類決策樹常見的分割準則（Criterion）有哪些？","o":["Gini 不純度、熵（Entropy）","MSE、MAE、R²","Sigmoid、Softmax","Accuracy、Precision"],"a":0,"e":"分類樹常用 Gini 不純度或熵作為分割準則。"},{"n":97,"t":"dt","s":"迴歸決策樹常見的分割準則為何？","o":["Precision、Recall","Sigmoid、Softmax","Gini、Entropy","平方誤差（MSE）、絕對誤差（MAE）等迴歸誤差"],"a":3,"e":"迴歸樹用迴歸誤差當分割準則，例如讓子節點的平方誤差或絕對誤差最小。","x":1},{"n":98,"t":"dt","s":"決策樹的 Feature Importance（特徵重要性）主要代表什麼？","o":["特徵的資料筆數","特徵的欄位名稱長度","特徵對模型分割及純度改善的相對貢獻","特徵的缺失值數量"],"a":2,"e":"樹模型常用「不純度減少量」（Mean Decrease in Impurity, MDI）計算特徵重要性；但此指標可能偏好取值種類較多的特徵，也不代表因果關係。","x":1},{"n":99,"t":"dt","s":"決策樹與隨機森林（Random Forest）最大的差異為何？","o":["決策樹使用多棵樹，隨機森林使用一棵樹","決策樹通常使用單棵樹進行預測；隨機森林結合多棵樹的預測結果","隨機森林只能處理分類","決策樹不需要訓練資料"],"a":1,"e":"Random Forest 利用多棵決策樹集成，通常可以降低單棵樹的變異與過擬合風險。"},{"n":100,"t":"dt","s":"在研究政府系統的異常行為偵測時，使用 Decision Tree 有什麼優勢？","o":["可以將判斷邏輯轉換成容易理解的規則，例如登入失敗次數、操作時間及存取行為","不需要評估模型效能","可以保證偵測所有攻擊行為","不需要任何歷史資料"],"a":0,"e":"決策樹適合建立可解釋的異常分類規則，例如：登入失敗次數是否異常？是否於非正常時段操作？是否短時間大量存取資料？是否出現不尋常的功能操作順序？但實際資安研究仍須搭配 Precision、Recall、F1、ROC-AUC 等指標，並注意資料不平衡及誤報問題。"}]};
const KEY = "aiot-quiz1-chatgpt-v1";
const L = "ABCD";
let state = { mode: "practice", topic: "all", wrongOnly: false, hideExt: false, picks: {} };
try { Object.assign(state, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
// 2026-11：這 10 題換成新題目，清掉舊題目的作答紀錄（其他題保留）
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const topicName = Object.fromEntries(DATA.topics.map(t => [t.k, t]));
const $ = id => document.getElementById(id);

const pool = () => DATA.items.filter(it => !(state.hideExt && it.x));

function renderChips() {
  const counts = {};
  pool().forEach(it => counts[it.t] = (counts[it.t] || 0) + 1);
  const all = [{ k: "all", zh: "全部", n: pool().length }].concat(DATA.topics.map(t => ({ k: t.k, zh: t.zh, n: counts[t.k] })));
  $("chips").innerHTML = all.map(t =>
    `<button type="button" class="chip" data-topic="${t.k}" aria-pressed="${state.topic === t.k}">${esc(t.zh)}<small>${t.n}</small></button>`).join("");
}

function card(it) {
  const pick = state.picks[it.n];
  const answered = pick !== undefined;
  const show = state.mode === "review" || answered;
  const opts = it.o.map((o, j) => {
    let cls = "opt";
    if (show && j === it.a) cls += " ok";
    if (state.mode === "practice" && answered && j === pick && pick !== it.a) cls += " no";
    const dis = state.mode === "review" || answered ? " disabled" : "";
    return `<button type="button" class="${cls}" data-q="${it.n}" data-j="${j}"${dis}><span class="k">${L[j]}.</span><span>${esc(o)}</span></button>`;
  }).join("");
  let ans = "";
  if (show) {
    const verdict = state.mode === "practice" && answered
      ? (pick === it.a ? "答對了。" : `<span class="wrong">你選 ${L[pick]}，答錯了。</span>`) : "";
    ans = `<div class="ans">${verdict}<b>答案：${L[it.a]}</b><br>解析：${esc(it.e)}</div>`;
  }
  return `<article class="q${it.x ? " x" : ""}" id="q${it.n}"><h3><span class="no">${it.n}</span><span>${it.x ? '<span class="ext">延伸</span>' : ""}${esc(it.s)}</span></h3><div class="opts">${opts}</div>${ans}</article>`;
}

function render() {
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === state.mode));
  $("wrongOnly").setAttribute("aria-pressed", state.wrongOnly);
  $("wrongOnly").hidden = state.mode !== "practice";
  $("hideExt").setAttribute("aria-pressed", state.hideExt);
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.topic === state.topic));

  let items = pool().filter(it => state.topic === "all" || it.t === state.topic);
  if (state.mode === "practice" && state.wrongOnly) items = items.filter(it => state.picks[it.n] !== undefined && state.picks[it.n] !== it.a);

  let html = "", cur = null;
  for (const it of items) {
    if (it.t !== cur) {
      cur = it.t;
      const t = topicName[cur];
      html += `<h2 class="sec-title">${esc(t.zh)}<span>${esc(t.en)}</span></h2>`;
    }
    html += card(it);
  }
  $("list").innerHTML = html || `<p class="empty">${state.wrongOnly ? "目前沒有答錯的題目。" : "沒有題目。"}</p>`;
  renderScore();
}

function renderScore() {
  const scope = pool().filter(it => state.topic === "all" || it.t === state.topic);
  const done = scope.filter(it => state.picks[it.n] !== undefined);
  const right = done.filter(it => state.picks[it.n] === it.a).length;
  const pct = done.length ? Math.round(right / done.length * 100) : 0;
  $("score").innerHTML = `答對 <b>${right}</b> / 已答 <b>${done.length}</b> / 共 ${scope.length}` + (done.length ? `（${pct}%）` : "");
}

document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.mode) { state.mode = b.dataset.mode; save(); render(); }
  else if (b.dataset.topic) { state.topic = b.dataset.topic; save(); render(); window.scrollTo({ top: $("list").offsetTop - 140 }); }
  else if (b.id === "wrongOnly") { state.wrongOnly = !state.wrongOnly; save(); render(); }
  else if (b.id === "hideExt") { state.hideExt = !state.hideExt; save(); renderChips(); render(); }
  else if (b.id === "reset") {
    if (confirm("清除所有作答紀錄？")) { state.picks = {}; state.wrongOnly = false; save(); render(); }
  }
  else if (b.dataset.q) {
    const n = +b.dataset.q, it = DATA.items[n - 1];
    state.picks[n] = +b.dataset.j; save();
    document.getElementById("q" + n).outerHTML = card(it);
    renderScore();
  }
});

renderChips();
render();
</script>
</body>
</html>
