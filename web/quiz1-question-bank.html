<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz 1 題庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Same lab-notebook palette as the Quiz 1 study page; a sticky toolbar carries mode, score and topic filter, questions are one column of cards */
:root {
  --bg: #f4f6f8; --surface: #ffffff; --fg: #17212b; --muted: #5a6876; --line: #d9e0e7;
  --accent: #1c6b86; --accent-soft: #e2eff4; --code-bg: #eef2f5; --mark: #b4541f;
  --good: #2f7a4a; --good-soft: #e3f2e8; --bad: #b23b3b; --bad-soft: #f8e5e5;
  --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1317; --surface: #151c22; --fg: #e2e8ee; --muted: #94a2af; --line: #263139;
    --accent: #63b5d2; --accent-soft: #15303a; --code-bg: #1a232b; --mark: #e39a6c;
    --good: #7cc89a; --good-soft: #15291d; --bad: #ec8b8b; --bad-soft: #351a1a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1317; --surface: #151c22; --fg: #e2e8ee; --muted: #94a2af; --line: #263139;
  --accent: #63b5d2; --accent-soft: #15303a; --code-bg: #1a232b; --mark: #e39a6c;
  --good: #7cc89a; --good-soft: #15291d; --bad: #ec8b8b; --bad-soft: #351a1a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: 64px;
}
a { color: var(--accent); text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 820px; margin: 0 auto; }

.mast { padding-block: 40px 18px; }
.eyebrow { font-size: 13px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
h1 { font-family: var(--font-display); font-weight: 900; font-size: clamp(28px, 5vw, 40px); line-height: 1.25; margin: 6px 0 10px; text-wrap: balance; }
.mast p { margin: 0; color: var(--muted); max-width: 64ch; }

.bar {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: 12px 0 10px; border-bottom: 1px solid var(--line);
  display: grid; gap: 10px;
}
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 5px 14px; cursor: pointer; font-size: 14px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); font-weight: 700; }
.score { font-family: var(--font-mono); font-size: 14px; color: var(--muted); margin-left: auto; white-space: nowrap; }
.score b { color: var(--fg); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 12px; cursor: pointer; font-size: 14px; }
.btn[aria-pressed="true"] { border-color: var(--bad); color: var(--bad); font-weight: 700; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.chip { flex: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 11px; background: var(--surface); cursor: pointer; font-size: 13.5px; color: var(--muted); white-space: nowrap; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--fg); font-weight: 700; }
.chip small { font-family: var(--font-mono); margin-left: 4px; }

.sec-title { font-family: var(--font-display); font-size: 21px; margin: 34px 0 6px; padding-bottom: 6px; border-bottom: 2px solid var(--accent); }
.sec-title span { font-family: var(--font-body); font-size: 14px; color: var(--muted); font-weight: 400; margin-left: 8px; }

.q { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-top: 14px; }
.q h3 { font-size: 16.5px; line-height: 1.6; margin: 0 0 10px; font-weight: 700; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; }
.q h3 .no { font-family: var(--font-mono); color: var(--accent); font-weight: 600; }
.opts { display: grid; gap: 6px; }
.opt { display: grid; grid-template-columns: 1.6em minmax(0, 1fr); gap: 6px; text-align: left; border: 1px solid var(--line); background: none; border-radius: 8px; padding: 7px 12px; cursor: pointer; line-height: 1.6; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt:disabled { cursor: default; }
.opt .k { font-family: var(--font-mono); font-weight: 600; color: var(--muted); }
.opt.ok { border-color: var(--good); background: var(--good-soft); font-weight: 700; }
.opt.ok .k { color: var(--good); }
.opt.no { border-color: var(--bad); background: var(--bad-soft); }
.opt.no .k { color: var(--bad); }
.ans { margin-top: 10px; padding: 9px 14px; border-left: 3px solid var(--accent); background: var(--code-bg); border-radius: 0 8px 8px 0; font-size: 15px; }
.ans b { color: var(--good); }
.ans .wrong { color: var(--bad); font-weight: 700; }
.empty { color: var(--muted); text-align: center; padding: 48px 0; }
.foot { margin-top: 40px; font-size: 14px; color: var(--muted); }
@media (max-width: 560px) {
  .score { margin-left: 0; width: 100%; }
  .q { padding: 14px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="eyebrow">AIoT-DA · Quiz 1 準備</div>
    <h1>監督式學習 200 題</h1>
    <p>範圍依 Notion「AIoT L8 Quiz 1 準備」：只考監督式學習，不含人工神經網路（MLP）與 LDA。練習模式點選選項即顯示對錯與解析，作答紀錄存在這台瀏覽器。重點整理見 <a href="quiz1-supervised-learning.html">Quiz 1 讀書頁</a>。</p>
  </header>

  <div class="bar">
    <div class="row">
      <div class="seg" role="group" aria-label="模式">
        <button type="button" data-mode="practice">練習</button>
        <button type="button" data-mode="review">看答案</button>
      </div>
      <button type="button" class="btn" id="wrongOnly" aria-pressed="false">只看答錯</button>
      <button type="button" class="btn" id="reset">重設作答</button>
      <div class="score" id="score"></div>
    </div>
    <div class="chips" id="chips" role="group" aria-label="主題"></div>
  </div>

  <main id="list"></main>
  <p class="foot">題目與解析由 Claude 依課程範圍整理，非老師公布的官方題目。</p>
</div>

<script>
const DATA = {"topics":[{"k":"lin","zh":"線性迴歸","en":"Linear Regression"},{"k":"reg","zh":"Ridge／Lasso 正則化","en":"Ridge / Lasso"},{"k":"log","zh":"邏輯迴歸","en":"Logistic Regression"},{"k":"knn","zh":"K 近鄰","en":"KNN"},{"k":"svm","zh":"支援向量機","en":"SVM / SVR"},{"k":"nb","zh":"朴素貝氏","en":"Naive Bayes"},{"k":"dt","zh":"決策樹","en":"Decision Tree"},{"k":"rf","zh":"隨機森林","en":"Random Forest"},{"k":"gb","zh":"梯度提升","en":"Gradient Boosting / XGBoost"},{"k":"met","zh":"評估指標","en":"Evaluation Metrics"},{"k":"prac","zh":"流程與實務","en":"Workflow & Practice"}],"items":[{"n":1,"t":"lin","s":"線性迴歸（Linear Regression）的主要目標是什麼？","o":["最大化分類準確率（Accuracy）","最小化殘差平方和（Sum of Squared Errors, SSE）","最大化輸入特徵的變異數","最小化模型使用的特徵數量"],"a":1,"e":"普通最小平方法（OLS）透過最小化實際值與預測值的平方誤差 Σ(yᵢ − ŷᵢ)²，求得最佳迴歸係數。"},{"n":2,"t":"lin","s":"下列何者是多元線性迴歸（Multiple Linear Regression）的數學模型？","o":["ŷ = σ(wᵀx + b)","ŷ = argmax P(y | x)","ŷ = log(x)","ŷ = b + w₁x₁ + w₂x₂ + ⋯ + wₚxₚ"],"a":3,"e":"多元線性迴歸用多個輸入特徵的線性組合預測連續數值；σ(wᵀx + b) 是邏輯迴歸。"},{"n":3,"t":"lin","s":"普通最小平方法（OLS）的閉式解（Normal Equation）為何？","o":["β = (XXᵀ)⁻¹y","β = XᵀXy","β = (XᵀX)⁻¹Xᵀy","β = Xᵀy / n"],"a":2,"e":"對 SSE 求導並令其為 0，得到正規方程 XᵀXβ = Xᵀy，因此 β = (XᵀX)⁻¹Xᵀy（需 XᵀX 可逆）。"},{"n":4,"t":"lin","s":"迴歸模型中的「殘差（Residual）」指的是什麼？","o":["實際值與預測值的差 yᵢ − ŷᵢ","預測值與平均值的差 ŷᵢ − ȳ","實際值與平均值的差 yᵢ − ȳ","特徵與特徵平均的差 xᵢ − x̄"],"a":0,"e":"殘差 eᵢ = yᵢ − ŷᵢ，是模型沒有解釋到的部分；OLS 就是最小化殘差平方和。"},{"n":5,"t":"lin","s":"判定係數 R²（Coefficient of Determination）代表什麼？","o":["預測正確的樣本比例","殘差的平均值","模型能解釋的目標變數變異比例","兩個特徵之間的相關係數"],"a":2,"e":"R² = 1 − SSE / SST，表示目標變數的總變異中有多少比例被模型解釋。"},{"n":6,"t":"lin","s":"若某迴歸模型在資料上的 R² = 0，代表什麼？","o":["模型表現和「永遠預測平均值 ȳ」一樣","所有迴歸係數都是負的","模型完美預測所有樣本","模型一定過擬合（Overfitting）"],"a":0,"e":"R² = 1 − SSE/SST，當 SSE = SST 時 R² = 0，等同用平均值當預測，模型沒有提供額外解釋力。"},{"n":7,"t":"lin","s":"在訓練資料上不斷加入新特徵，R² 會怎麼變化？","o":["一定會下降","一定會變成 1","不會下降，所以需要調整後 R²（Adjusted R²）來比較模型","完全不變"],"a":2,"e":"加特徵最差也只是係數為 0，訓練 SSE 不會變大，R² 只增不減；Adjusted R² 會對特徵數加以懲罰。"},{"n":8,"t":"lin","s":"調整後 R²（Adjusted R²）相較 R² 多考慮了什麼？","o":["把 R² 轉成百分比","計算每個係數的 p 值","自動移除異常值","特徵數量（對加入無用特徵加以懲罰）"],"a":3,"e":"Adjusted R² = 1 − (1 − R²)(n − 1)/(n − p − 1)，加入沒有幫助的特徵時反而會下降。"},{"n":9,"t":"lin","s":"多重共線性（Multicollinearity）對線性迴歸的主要影響是什麼？","o":["殘差會全部變成 0","係數估計不穩定、標準誤變大，難以解釋個別係數","模型會變成非線性模型","模型無法輸出任何預測值"],"a":1,"e":"特徵高度相關時 XᵀX 接近奇異，係數對資料很敏感、符號可能反轉，但整體預測能力不一定變差。"},{"n":10,"t":"lin","s":"下列哪個指標常用來檢測多重共線性？","o":["Gini 不純度","混淆矩陣（Confusion Matrix）","變異數膨脹因子（VIF）","ROC-AUC"],"a":2,"e":"VIFⱼ = 1/(1 − Rⱼ²)，Rⱼ² 是第 j 個特徵被其他特徵迴歸的 R²；一般 VIF > 10 視為嚴重共線性。"},{"n":11,"t":"lin","s":"下列何者「不是」線性迴歸的經典假設？","o":["自變數與因變數之間為線性關係","所有特徵都必須服從均勻分布","誤差項彼此獨立","誤差項變異數固定（同質變異, Homoscedasticity）"],"a":1,"e":"經典假設包含線性、誤差獨立、同質變異、誤差常態（用於推論）、無完全共線性；並不要求特徵服從某種分布。"},{"n":12,"t":"lin","s":"殘差圖（Residual Plot）呈現「漏斗狀」，隨預測值增大而散開，代表什麼問題？","o":["類別不平衡","異質變異（Heteroscedasticity）","模型完美擬合","多重共線性"],"a":1,"e":"殘差的變異數隨 ŷ 改變，違反同質變異假設，可考慮對 y 取 log 或使用加權最小平方法。"},{"n":13,"t":"lin","s":"多元線性迴歸中特徵 x₁ 的係數 w₁ = 3，應如何解讀？","o":["x₁ 的重要性是其他特徵的 3 倍","x₁ 與 y 的相關係數為 3","其他特徵不變時，x₁ 增加 1 單位，ŷ 平均增加 3","y 增加 1 單位時，x₁ 增加 3"],"a":2,"e":"係數是在「控制其他變數」下的邊際效果；係數大小也受特徵尺度影響，不能直接當重要性比較。"},{"n":14,"t":"lin","s":"為什麼 OLS 線性迴歸對異常值（Outlier）特別敏感？","o":["OLS 只看中位數","平方誤差會放大大的殘差，使擬合線被拉向異常值","OLS 使用的是絕對誤差","OLS 會自動刪除異常值"],"a":1,"e":"一個殘差為 10 的點貢獻 100 的平方誤差，對損失影響遠大於一般點；可改用 Huber 或 RANSAC 等穩健迴歸。"},{"n":15,"t":"lin","s":"比較 MSE 與 MAE 兩種損失，哪一個對異常值比較敏感？","o":["兩者一樣敏感","MAE","兩者都完全不受異常值影響","MSE"],"a":3,"e":"MSE 對誤差取平方，大誤差被放大；MAE 取絕對值，對異常值較穩健。"},{"n":16,"t":"lin","s":"梯度下降（Gradient Descent）更新參數的公式為何？（η 為學習率）","o":["w ← w / η","w ← η·w","w ← w + η·∂L/∂w","w ← w − η·∂L/∂w"],"a":3,"e":"沿著損失函數梯度的反方向走一小步，才會讓損失下降。"},{"n":17,"t":"lin","s":"梯度下降的學習率（Learning Rate）設得太大，最可能發生什麼事？","o":["損失震盪甚至發散，無法收斂","一定收斂得更準確","自動變成閉式解","收斂速度變得非常慢"],"a":0,"e":"步伐太大會跨過最低點來回震盪；太小則收斂很慢。"},{"n":18,"t":"lin","s":"什麼情況下會用梯度下降取代正規方程求線性迴歸？","o":["特徵維度很大時，計算 (XᵀX)⁻¹ 的成本太高","正規方程算出的答案不精確","正規方程只能用於分類","梯度下降不需要任何資料"],"a":0,"e":"矩陣反運算約 O(p³)，特徵很多或資料量很大時，迭代式的梯度下降（或 SGD）較可行。"},{"n":19,"t":"lin","s":"多項式迴歸（Polynomial Regression）ŷ = w₀ + w₁x + w₂x² 屬於哪種模型？","o":["對參數仍是線性，可以用線性迴歸方法求解","完全非線性，不能用 OLS","是一種分類模型","不需要任何特徵"],"a":0,"e":"「線性」指的是對參數 w 線性；把 x² 當成新特徵後，就是一般的多元線性迴歸。"},{"n":20,"t":"lin","s":"對有 k 個類別的特徵做 One-hot 編碼放進線性迴歸時，為何常只保留 k − 1 個虛擬變數？","o":["因為最後一個類別一定不重要","為了讓 R² 變成 1","可以讓模型訓練變慢","避免虛擬變數陷阱（Dummy Variable Trap）造成完全共線性"],"a":3,"e":"k 個虛擬變數加總恆為 1，與截距完全共線；丟掉一個類別作為基準即可（sklearn 可用 drop='first'）。"},{"n":21,"t":"lin","s":"線性迴歸中截距 b（Intercept）的意義是什麼？","o":["誤差項的變異數","迴歸線的斜率","模型的 R²","所有特徵都為 0 時的預測值"],"a":3,"e":"ŷ = b + Σwⱼxⱼ，當所有 xⱼ = 0 時 ŷ = b；它不一定有實際意義（例如房屋面積為 0）。"},{"n":22,"t":"lin","s":"簡單線性迴歸 ŷ = b + wx 中，最小平方法求得的斜率 w 為何？","o":["ȳ / x̄","Cov(x, y) / Var(x)","Corr(x, y) × Var(y)","Var(x) / Cov(x, y)"],"a":1,"e":"w = Σ(xᵢ − x̄)(yᵢ − ȳ) / Σ(xᵢ − x̄)²，截距 b = ȳ − w·x̄。"},{"n":23,"t":"lin","s":"自迴歸模型 AR(p)（Auto-Regression）如何用線性迴歸做時間序列預測？","o":["以過去 p 期的觀測值作為特徵，預測下一期的值","把時間序列轉成類別後投票","用隨機亂數作為特徵","用未來的值當特徵預測現在"],"a":0,"e":"yₜ = c + φ₁yₜ₋₁ + ⋯ + φₚyₜ₋ₚ + εₜ；L05 的股票預測就是把落後值（lag）當成迴歸特徵。"},{"n":24,"t":"lin","s":"模型訓練誤差很低、測試誤差卻很高，最可能的原因是？","o":["過擬合（Overfitting）","欠擬合（Underfitting）","資料太少導致無法計算誤差","模型已經完美"],"a":0,"e":"模型記住了訓練資料的雜訊、泛化能力差；可用正則化、減少特徵或增加資料改善。"},{"n":25,"t":"lin","s":"下列哪個問題最適合直接用線性迴歸處理？","o":["把影像壓縮成低維向量","把顧客分成幾個群組","判斷一封郵件是否為垃圾郵件","依坪數、屋齡、地段預測房價"],"a":3,"e":"線性迴歸預測連續數值；垃圾郵件是分類，分群與降維屬於非監督式學習。"},{"n":26,"t":"reg","s":"Ridge 迴歸在損失函數中加入的懲罰項為何？","o":["λΣyᵢ","λ × 特徵數量","λΣwⱼ²（L2 正則化）","λΣ|wⱼ|（L1 正則化）"],"a":2,"e":"Ridge 最小化 SSE + λ‖w‖²，讓係數變小但通常不會剛好為 0。"},{"n":27,"t":"reg","s":"Lasso 迴歸在損失函數中加入的懲罰項為何？","o":["λ × 樣本數","λΣwⱼ³","λΣwⱼ²（L2 正則化）","λΣ|wⱼ|（L1 正則化）"],"a":3,"e":"Lasso = Least Absolute Shrinkage and Selection Operator，懲罰係數的絕對值總和。"},{"n":28,"t":"reg","s":"哪一種方法可以讓部分係數剛好變成 0，達到特徵選擇（Feature Selection）的效果？","o":["Ridge（L2）","普通最小平方法（OLS）","三者都不能","Lasso（L1）"],"a":3,"e":"L1 懲罰會產生稀疏解，不重要特徵的係數被壓到 0；Ridge 只會縮小係數。"},{"n":29,"t":"reg","s":"為什麼 L1 正則化容易產生稀疏（Sparse）的係數？","o":["L1 的限制區域是菱形，角點落在座標軸上，最佳解容易出現在某些係數為 0 的位置","L1 處處可微所以收斂到 0","L1 會把大係數平方放大","L1 會自動增加特徵數量"],"a":0,"e":"從幾何角度看，等高線最先碰到菱形的角點，而角點代表某些 wⱼ = 0；L2 的圓形限制區域沒有角點。"},{"n":30,"t":"reg","s":"正則化強度 λ 增大時，模型會如何變化？","o":["係數變大，模型更複雜","係數被壓得更小，偏差（Bias）上升、變異（Variance）下降","對模型完全沒有影響","變異上升、偏差下降"],"a":1,"e":"λ 越大越限制模型複雜度，較不易過擬合，但太大會欠擬合。"},{"n":31,"t":"reg","s":"Ridge 或 Lasso 的 λ = 0 時，會變成什麼模型？","o":["邏輯迴歸","無解","所有係數都為 0 的模型","一般的最小平方線性迴歸（OLS）"],"a":3,"e":"沒有懲罰項，就只剩最小化 SSE，即普通線性迴歸。"},{"n":32,"t":"reg","s":"Ridge 迴歸的 λ → ∞ 時，模型會如何？","o":["係數趨近無限大","模型嚴重過擬合","與 OLS 完全相同","係數（截距除外）趨近 0，模型嚴重欠擬合"],"a":3,"e":"懲罰無限大時只能讓係數為 0，預測值趨近常數（平均值）。"},{"n":33,"t":"reg","s":"Elastic Net 是什麼？","o":["同時結合 L1 與 L2 懲罰的線性迴歸","只使用 L1 懲罰的模型","一種樹模型","一種核方法"],"a":0,"e":"Elastic Net 用 l1_ratio 控制兩種懲罰比例，兼具 Lasso 的特徵選擇與 Ridge 對共線特徵的穩定性。"},{"n":34,"t":"reg","s":"使用 Ridge／Lasso 之前，為什麼通常要先標準化（Standardization）特徵？","o":["懲罰依係數大小計算，特徵尺度不同會造成不公平的懲罰","正則化模型完全不需要標準化","為了讓 y 服從標準常態分布","標準化可以加快讀取檔案"],"a":0,"e":"單位小的特徵需要大係數，會被懲罰得更重；標準化後各特徵在同一尺度上公平比較。"},{"n":35,"t":"reg","s":"Ridge 迴歸對多重共線性有什麼幫助？","o":["沒有任何幫助","會自動刪除所有相關特徵","會讓共線性更嚴重","使 XᵀX + λI 一定可逆，係數估計更穩定"],"a":3,"e":"加上 λI 後矩陣的特徵值都至少為 λ > 0，解變得穩定，這也是 Ridge 最初被提出的動機。"},{"n":36,"t":"reg","s":"Ridge 迴歸的閉式解為何？","o":["β = (XᵀX − λI)⁻¹Xᵀy","β = (XᵀX)⁻¹Xᵀy","β = (XᵀX + λI)⁻¹Xᵀy","β = λXᵀy"],"a":2,"e":"對 ‖y − Xβ‖² + λ‖β‖² 求導並令其為 0 即可得到。Lasso 因絕對值不可微，沒有閉式解。"},{"n":37,"t":"reg","s":"一組彼此高度相關的特徵放進 Lasso，通常會發生什麼事？","o":["所有特徵平均分配係數","傾向只選其中一個，其餘係數設為 0","全部保留相同係數","全部被刪除"],"a":1,"e":"Lasso 在相關特徵間的選擇有些任意；Ridge 則會把係數分攤給它們，Elastic Net 介於兩者之間。"},{"n":38,"t":"reg","s":"在迴歸模型中使用正則化（Regularization）的主要目的為何？","o":["加快資料收集速度","增加模型參數數量","提高訓練資料上的準確率","降低過擬合、提升泛化能力"],"a":3,"e":"正則化限制模型複雜度，以些微訓練誤差換取更好的測試表現。"},{"n":39,"t":"reg","s":"scikit-learn 的 Ridge(alpha=1.0) 中，alpha 代表什麼？","o":["決策樹的數量","梯度下降的學習率","KNN 的鄰居數","正則化強度 λ"],"a":3,"e":"sklearn 用 alpha 表示 λ；注意 LogisticRegression 和 SVC 用的 C 則是正則化強度的倒數。"},{"n":40,"t":"reg","s":"應該如何選擇 Ridge／Lasso 的 λ？","o":["選讓訓練誤差最小的 λ","隨便選一個值即可","用交叉驗證（例如 RidgeCV、LassoCV）比較驗證誤差","直接用測試集挑最好的 λ"],"a":2,"e":"訓練誤差最小一定是 λ = 0；用測試集調參會造成資訊洩漏，應使用交叉驗證。"},{"n":41,"t":"reg","s":"Ridge／Lasso 通常會不會對截距 b 加以懲罰？","o":["一定要懲罰截距","截距取絕對值後懲罰","通常不懲罰截距","截距固定為 0"],"a":2,"e":"截距只是平移 y 的平均水準，懲罰它會讓結果依賴 y 的原點位置，沒有道理。"},{"n":42,"t":"reg","s":"從偏差-變異權衡（Bias-Variance Tradeoff）的角度，正則化做了什麼？","o":["只降低偏差","同時增加偏差與變異","用少量偏差的增加，換取較大幅度的變異降低","與偏差、變異無關"],"a":2,"e":"縮小係數讓模型對訓練資料的小變動不那麼敏感，總誤差（偏差² + 變異 + 雜訊）可能下降。"},{"n":43,"t":"reg","s":"特徵數 p 大於樣本數 n 時，下列敘述何者正確？","o":["Ridge 與 Lasso 都無法使用","必須刪除樣本到 n < p","OLS 的 XᵀX 不可逆而無唯一解，Ridge／Lasso 仍可求解","OLS 一定表現最好"],"a":2,"e":"p > n 時 XᵀX 秩不足，OLS 有無限多解；正則化提供唯一且穩定的解。"},{"n":44,"t":"log","s":"邏輯迴歸（Logistic Regression）使用的 Sigmoid 函數為何？","o":["σ(z) = 1 / (1 + e⁻ᶻ)","σ(z) = z²","σ(z) = eᶻ","σ(z) = max(0, z)"],"a":0,"e":"Sigmoid 把任意實數壓到 (0, 1)，可解讀為正類的機率。max(0, z) 是 ReLU。"},{"n":45,"t":"log","s":"二元邏輯迴歸的輸出代表什麼？","o":["樣本屬於正類的機率（0 到 1）","類別的總數","樣本到超平面的距離","任意實數的預測值"],"a":0,"e":"P(y = 1 | x) = σ(wᵀx + b)，再用閾值（預設 0.5）轉成類別。"},{"n":46,"t":"log","s":"邏輯迴歸主要用來解決哪一類問題？","o":["降維（Dimensionality Reduction）","預測連續值的回歸","分群（Clustering）","分類（Classification）"],"a":3,"e":"名稱雖有「迴歸」，但它是分類模型，常作為分類問題的基線（Baseline）。"},{"n":47,"t":"log","s":"邏輯迴歸訓練時最常用的損失函數為何？","o":["交叉熵／對數損失（Log Loss）","均方誤差（MSE）","Hinge Loss","Gini 不純度"],"a":0,"e":"L = −[y log ŷ + (1 − y) log(1 − ŷ)]，等價於最大化概似函數。Hinge Loss 是 SVM 使用的。"},{"n":48,"t":"log","s":"為什麼邏輯迴歸不用 MSE 當損失函數？","o":["這只是習慣，沒有原因","MSE 計算太快","MSE 無法計算","搭配 Sigmoid 時 MSE 為非凸函數，容易卡在局部極小；交叉熵則是凸函數"],"a":3,"e":"交叉熵對 w 為凸函數，梯度下降可找到全域最佳解，梯度形式也較簡潔。"},{"n":49,"t":"log","s":"邏輯迴歸中的 logit（對數勝算）為何？","o":["p² = wᵀx + b","log(p / (1 − p)) = wᵀx + b","p = wᵀx + b","log p = wᵀx"],"a":1,"e":"邏輯迴歸假設對數勝算是特徵的線性函數，這是它被稱為「迴歸」的原因。"},{"n":50,"t":"log","s":"邏輯迴歸中特徵 xⱼ 的係數為 wⱼ，應如何解讀？","o":["xⱼ 增加 1 單位，機率增加 wⱼ","xⱼ 增加 1 單位，y 增加 wⱼ","xⱼ 增加 1 單位，勝算（Odds）乘以 e^wⱼ","邏輯迴歸係數無法解釋"],"a":2,"e":"log-odds 增加 wⱼ，等於 odds 乘以 e^wⱼ（勝算比, Odds Ratio）；機率的變化量則不是常數。"},{"n":51,"t":"log","s":"邏輯迴歸的決策邊界（Decision Boundary）是什麼形狀？","o":["線性（wᵀx + b = 0 的超平面）","一定是圓形","不存在決策邊界","一定是複雜曲線"],"a":0,"e":"σ(z) = 0.5 恰好在 z = 0，因此邊界為線性超平面；要非線性邊界需加入非線性特徵。"},{"n":52,"t":"log","s":"以閾值 0.5 判斷類別時，決策邊界對應 wᵀx + b 等於多少？","o":["1","−1","0.5","0"],"a":3,"e":"σ(0) = 0.5，所以 wᵀx + b > 0 預測正類，< 0 預測負類。"},{"n":53,"t":"log","s":"把分類閾值從 0.5 提高到 0.8，通常會發生什麼？","o":["沒有任何影響","Precision 上升、Recall 下降","Recall 上升、Precision 下降","Precision 與 Recall 都上升"],"a":1,"e":"只有很有把握才判為正類，誤報（FP）減少，但漏掉（FN）的正類變多。"},{"n":54,"t":"log","s":"邏輯迴歸如何處理多類別分類？","o":["使用 Softmax（多項邏輯迴歸）或 One-vs-Rest","改成線性迴歸","邏輯迴歸無法處理多類別","用一個 Sigmoid 直接輸出類別編號"],"a":0,"e":"Softmax 把每類分數轉成總和為 1 的機率；OvR 則為每一類訓練一個二元分類器。"},{"n":55,"t":"log","s":"Softmax 函數輸出的特性是什麼？","o":["每個輸出只能是 0 或 1","輸出可以是負值","輸出總和等於類別數","各類別機率皆介於 0 到 1，且總和為 1"],"a":3,"e":"softmax(zₖ) = e^zₖ / Σⱼ e^zⱼ，二元時就退化為 Sigmoid。"},{"n":56,"t":"log","s":"scikit-learn 的 LogisticRegression(C=...) 中，C 代表什麼？","o":["梯度下降的學習率","正則化強度，C 越大正則化越強","類別的數量","正則化強度的倒數，C 越小正則化越強"],"a":3,"e":"C = 1/λ；C 很大時接近不正則化，C 很小時係數被壓得很小。"},{"n":57,"t":"log","s":"邏輯迴歸的參數通常用什麼方法估計？","o":["多數投票","最小平方閉式解","貪婪切分","最大概似估計（Maximum Likelihood Estimation, MLE）"],"a":3,"e":"最大化觀測資料的概似函數，等價於最小化交叉熵損失。"},{"n":58,"t":"log","s":"邏輯迴歸的參數有沒有像 OLS 那樣的閉式解？","o":["沒有，需要用迭代優化（梯度下降、牛頓法、lbfgs 等）","有，直接取平均值","只有在多類別時才有","有，β = (XᵀX)⁻¹Xᵀy"],"a":0,"e":"Sigmoid 的非線性使得梯度為 0 的方程沒有解析解；sklearn 預設 solver 為 lbfgs。"},{"n":59,"t":"log","s":"訓練資料完全線性可分，且不加正則化時，邏輯迴歸會發生什麼？","o":["損失函數變成負值","係數趨向無限大，最佳化無法收斂","模型自動提早停止並給出唯一解","準確率變成 0"],"a":1,"e":"把 ‖w‖ 不斷放大可讓機率逼近 0 或 1、損失持續下降；加入正則化可避免。"},{"n":60,"t":"log","s":"資料的類別邊界是非線性時，如何讓邏輯迴歸處理？","o":["完全不可能","移除所有特徵","把損失函數換成 MSE","加入多項式或交互作用特徵（Feature Engineering）"],"a":3,"e":"例如加入 x₁²、x₂²、x₁x₂ 後，在原始特徵空間中可形成圓形或曲線邊界。"},{"n":61,"t":"log","s":"邏輯迴歸名稱有「迴歸」卻用於分類，原因是什麼？","o":["它的輸出就是連續的 y","它只能做連續值預測","它對 log-odds 做線性迴歸，再用機率閾值轉成分類","命名錯誤，沒有理由"],"a":2,"e":"模型本身回歸的是機率（log-odds），分類是在機率上加閾值的結果。"},{"n":62,"t":"log","s":"scikit-learn 分類器的 predict_proba() 與 predict() 有什麼差別？","o":["predict_proba 回傳模型係數","predict_proba 回傳各類別機率，predict 回傳預測類別","兩者剛好相反","兩者完全相同"],"a":1,"e":"predict 等於取機率最大的類別（二元時即閾值 0.5）；需要自訂閾值時用 predict_proba。"},{"n":63,"t":"log","s":"邏輯迴歸遇到類別不平衡（Class Imbalance）時，下列哪個做法合適？","o":[ 理中，P(y) 稱為什麼？","o":["後驗機率（Posterior）","概似（Likelihood）","先驗機率（Prior）","證據（Evidence）"],"a":2,"e":"P(y) 是看到資料前對類別的信念，通常用訓練資料中各類別的比例估計。"},{"n":112,"t":"nb","s":"朴素貝氏最後如何決定預測類別？","o":["隨機選一個類別","取所有類別的平均","選擇後驗機率最大的類別（MAP）","選擇後驗機率最小的類別"],"a":2,"e":"ŷ = argmaxᵧ P(y)Π P(xⱼ | y)。"},{"n":113,"t":"nb","s":"下列何者是朴素貝氏的優點？","o":["完全不需要訓練資料","能完整捕捉特徵間的交互作用","訓練非常快、適合高維文字資料、小資料也能用","在所有資料上都是最準的"],"a":2,"e":"只需計算各類別下各特徵的統計量，複雜度與資料量呈線性。"},{"n":114,"t":"nb","s":"朴素貝氏的主要缺點是什麼？","o":["訓練速度非常慢","不能做多類別分類","一定要使用 GPU","特徵條件獨立假設常不成立，機率估計可能過於極端"],"a":3,"e":"雖然機率值可能不準，但排序（分類結果）常常仍然不錯。"},{"n":115,"t":"nb","s":"實作朴素貝氏時，為什麼常把機率取對數後相加？","o":["避免許多很小的機率連乘造成數值下溢（Underflow）","這是規定，沒有原因","讓模型收斂更快","提高準確率"],"a":0,"e":"log 把連乘變成相加，且 log 單調遞增，不影響 argmax 的結果。"},{"n":116,"t":"nb","s":"朴素貝氏屬於生成式（Generative）還是判別式（Discriminative）模型？","o":["非參數的距離模型","生成式：建模 P(x | y) 與 P(y)","判別式：直接建模 P(y | x)","集成模型"],"a":1,"e":"邏輯迴歸是判別式模型的代表；朴素貝氏則建模資料是如何從類別「生成」的。"},{"n":117,"t":"nb","s":"BernoulliNB 適合處理什麼樣的特徵？","o":["詞出現的次數","二元特徵，例如某個詞「有沒有」出現","連續數值特徵","影像的像素值"],"a":1,"e":"BernoulliNB 也會明確考慮「某詞沒出現」這件事。"},{"n":118,"t":"nb","s":"下列哪個是朴素貝氏的經典應用？","o":["房價預測","垃圾郵件過濾（Spam Filtering）","股價的數值預測","影像生成"],"a":1,"e":"垃圾郵件過濾是高維文字分類，正好發揮朴素貝氏快速、適合高維的優點。"},{"n":119,"t":"nb","s":"朴素貝氏分類時，為什麼可以忽略分母 P(x)？","o":["P(x) 無法計算所以直接丟掉","P(x) 對所有類別都相同，不影響哪個類別的後驗最大","P(x) 一定等於 1","P(x) 一定等於 0"],"a":1,"e":"比較各類別 P(y | x) 的大小時，相同的分母可以省略。"},{"n":120,"t":"nb","s":"GaussianNB 在訓練時需要估計哪些參數？","o":["所有特徵間完整的共變異矩陣","核函數的參數","決策樹的深度","每個類別下每個特徵的平均值與變異數（以及類別先驗）"],"a":3,"e":"由於條件獨立假設，只需估計各特徵的一維常態分布，不需要共變異矩陣。"},{"n":121,"t":"dt","s":"Gini 不純度（Gini Impurity）的公式為何？","o":["Σpₖ","max pₖ","−Σpₖ log₂ pₖ","1 − Σpₖ²"],"a":3,"e":"pₖ 為節點中第 k 類的比例；−Σpₖ log₂ pₖ 是熵。"},{"n":122,"t":"dt","s":"資訊熵（Entropy）的公式為何？","o":["1 − max pₖ","−Σpₖ log₂ pₖ","Σpₖ²","1 − Σpₖ²"],"a":1,"e":"熵衡量不確定性；節點越純，熵越低。1 − max pₖ 是誤分類率。"},{"n":123,"t":"dt","s":"決策樹中「資訊增益（Information Gain）」的定義為何？","o":["子節點的熵 − 父節點的熵","父節點的熵 − 子節點熵的加權平均","樹的深度","葉節點的數量"],"a":1,"e":"增益越大代表切分後不確定性下降越多，ID3 選擇增益最大的特徵切分。" 策樹使用什麼準則選擇切分特徵？","o":["均方誤差","Gini 不純度","Hinge Loss","資訊增益／增益比（Gain Ratio）"],"a":3,"e":"ID3 用資訊增益；C4.5 改用增益比修正；CART 則用 Gini。"},{"n":138,"t":"dt","s":"資訊增益有什麼偏差（Bias）？","o":["偏好二元特徵","偏好取值很多的特徵（例如 ID 欄位），增益比可修正","偏好連續特徵以外的特徵","沒有任何偏差"],"a":1,"e":"取值多的特徵能把資料切得很碎，增益看起來很高，但沒有泛化能力。"},{"n":139,"t":"dt","s":"決策樹的 feature_importances_ 是怎麼計算的？","o":["各特徵在所有切分中帶來的（加權）不純度減少總和","線性迴歸係數的絕對值","特徵出現在樹中的深度","隨機產生"],"a":0,"e":"這稱為 MDI（Mean Decrease in Impurity），再正規化成總和為 1。"},{"n":140,"t":"dt","s":"決策樹設 max_depth=None 且沒有其他限制時，會怎樣？","o":["容易欠擬合","程式會報錯","只會長一層","會一直長到葉節點純淨，訓練準確率接近 100%，容易過擬合"],"a":3,"e":"完全生長的樹偏差低、變異高，因此需要限制或改用集成方法。"},{"n":141,"t":"rf","s":"隨機森林（Random Forest）結合了哪些技術？","o":["Boosting 依序修正錯誤","Bagging（自助抽樣）＋ 每次切分隨機選特徵子集","線性模型加正則化","單一棵深決策樹"],"a":1,"e":"樣本隨機（Bootstrap）與特徵隨機兩種隨機性，讓每棵樹不同。"},{"n":142,"t":"rf","s":"Bootstrap 抽樣是指什麼？","o":["無放回抽出一半樣本","依時間順序抽樣","從原資料「有放回」抽出與原資料一樣多的樣本","只抽少數類別"],"a":2,"e":"有放回抽樣讓同一筆資料可能被抽到多次，有些則完全沒被抽到。"},{"n":143,"t":"rf","s":"隨機森林相對單一決策樹，主要降低的是什麼？","o":["資料量","偏差（Bias）","特徵數量","變異（Variance）"],"a":3,"e":"多棵高變異、低偏差的樹取平均，變異下降，偏差大致不變。"},{"n":144,"t":"rf","s":"隨機森林在每次切分時只隨機考慮部分特徵，目的是什麼？","o":["降低樹與樹之間的相關性，讓平均更有效","提高單棵樹的準確率","減少樣本數量","加快讀取資料"],"a":0,"e":"若有一個很強的特徵，每棵樹都會用它切根節點，樹太像；隨機特徵讓樹更多樣。"},{"n":145,"t":"rf","s":"隨機森林的 OOB（Out-of-Bag）樣本可以做什麼用？","o":["沒被該樹抽到的樣本，可用來估計泛化誤差","只用於訓練","就是最終的測試集","是重複抽到的樣本"],"a":0,"e":"每個樣本用沒抽到它的那些樹預測，得到近似交叉驗證的 OOB score。"},{"n":146,"t":"rf","s":"Bootstrap 抽樣中，某筆資料「沒被抽到」的機率大約是多少？","o":["約 36.8%（≈ 1/e）","0%","10%","50%"],"a":0,"e":"(1 − 1/n)ⁿ → 1/e ≈ 0.368，所以每棵樹約有 63.2% 的不重複樣本。"},{"n":147,"t":"rf","s":"隨機森林分類器如何產生最終預測？","o":["所有樹多數投票（或平均預測機率）","加總所有樹的殘差","選最深的那棵樹","只看第一棵樹"],"a":0,"e":"sklearn 的 RandomForestClassifier 實際上是平均各樹的機率（soft voting）。"},{"n":148,"t":"rf","s":"隨機森林回歸器如何產生最終預測？","o":["所有樹預測值的平均","取最大的預測值","取第一棵樹的預測","多數投票"],"a":0,"e":"平均可以降低單棵回歸樹預測的變異。"},{"n":149,"t":"rf","s":"增加隨機森林的樹數量（n_estimators），通常會怎樣？","o":["準確率一定下降","表現逐漸趨於穩定、不太會因此過擬合，但計算成本增加","一定會過擬合","完全沒有變化"],"a":1,"e":"樹越多平均越穩定，到一定數量後效益遞減；Boosting 則 麼樣的基學習器？","o":["完全生長的深樹","較淺的決策樹（弱學習器）","朴素貝氏","KNN"],"a":1,"e":"常見 max_depth 為 3～8；淺樹偏差高、變異低，正好由 Boosting 降低偏差。"},{"n":163,"t":"gb","s":"以 MSE 為損失時，梯度提升每棵新樹擬合的「負梯度」等於什麼？","o":["預測值 ŷ","真實值 y 的平方","殘差 y − ŷ","常數 1"],"a":2,"e":"L = ½(y − ŷ)²，−∂L/∂ŷ = y − ŷ，所以「擬合殘差」是梯度提升在 MSE 下的特例。"},{"n":164,"t":"gb","s":"XGBoost 相較傳統梯度提升的特色之一是什麼？","o":["只能用於線性問題","完全不使用樹","沒有任何正則化","目標函數加入正則化（葉節點數與葉權重的 L2），並使用二階導數資訊"],"a":3,"e":"XGBoost 用泰勒二階展開近似損失，搭配正則化項控制樹的複雜度。"},{"n":165,"t":"gb","s":"XGBoost 如何處理缺失值（Missing Values）？","o":["一律填 0 才能訓練","遇到缺失值會報錯","訓練時學習缺值該走的預設分支方向","必須先刪除所有缺失值"],"a":2,"e":"每個切分點會嘗試把缺值放左邊或右邊，選增益較大的方向。"},{"n":166,"t":"gb","s":"梯度提升中的提前停止（Early Stopping）是什麼？","o":["驗證集表現連續多輪不再提升時，就停止加入新樹","不斷加樹直到用完記憶體","刪除不重要的特徵","訓練一開始就停止"],"a":0,"e":"提前停止可自動決定樹的數量並避免過擬合。"},{"n":167,"t":"gb","s":"LightGBM 的主要特色是什麼？","o":["它是一種神經網路","只能逐層（Level-wise）長樹且很慢","不支援類別特徵","以葉節點導向（Leaf-wise）長樹，搭配直方圖演算法，訓練速度快"],"a":3,"e":"Leaf-wise 每次分裂增益最大的葉節點，效率高但容易過擬合，需搭配 num_leaves 等限制。"},{"n":168,"t":"gb","s":"AdaBoost 如何讓後面的學習器專注於困難樣本？","o":["隨機選擇特徵子集","提高前一輪被分錯樣本的權重","有放回地重新抽樣","擬合前一輪的殘差"],"a":1,"e":"AdaBoost 調整樣本權重；梯度提升則改為擬合損失函數的負梯度。"},{"n":169,"t":"gb","s":"梯度提升的樹很多、學習率又很大時，容易發生什麼？","o":["一定欠擬合","訓練速度變得更快且更準","沒有任何影響","過擬合"],"a":3,"e":"Boosting 會持續降低訓練誤差，最終開始擬合雜訊；需搭配提前停止與較小學習率。"},{"n":170,"t":"gb","s":"與隨機森林相比，梯度提升的訓練能否在「樹與樹之間」平行化？","o":["可以，所有樹完全獨立","一次只能有一棵樹","完全無法訓練","不能，樹必須依序訓練（但單棵樹內的切分搜尋可平行）"],"a":3,"e":"每棵新樹依賴前一輪的預測結果；XGBoost／LightGBM 的平行化是在特徵與切分點層級。"},{"n":171,"t":"gb","s":"梯度提升設定 subsample < 1.0 有什麼效果？","o":["只會增加偏差，沒有好處","刪除部分特徵","沒有任何效果","每棵樹只用部分樣本訓練（隨機梯度提升），增加隨機性以降低過擬合"],"a":3,"e":"類似 Bagging 的抽樣概念，常見值 0.5～0.8。"},{"n":172,"t":"gb","s":"下列何者「不是」梯度提升樹常調整的超參數？","o":["max_depth","n_neighbors","learning_rate","n_estimators"],"a":1,"e":"n_neighbors 是 KNN 的參數；梯度提升還常調 subsample、colsample_bytree、min_child_weight 等。"},{"n":173,"t":"gb","s":"在結構化（表格）資料的競賽中，哪一類模型最常拿到頂尖成績？","o":["梯度提升樹（XGBoost、LightGBM、CatBoost）","KNN","朴素貝氏","單純的線性迴歸"],"a":0,"e":"梯度提升對異質特徵、非線性與交互作用處理得很好，是 Kaggle 表格資料的主力。"},{"n":174,"t":"gb","s":"XGBoost 在 Python 中由哪裡提供？","o":["sklearn.neighbors","sklearn.linear_model","獨立的 xgboost 套件，不是 scikit-learn 內建","Python 標準函式庫"],"a":2,"e":"需 pip install xgboost；它提供與 sklearn 相容的 XGBClassifier／XGBRegressor 介面。"},{"n":175,"t":"gb","s":"Bagging 與 Boosting 的差異，下列何者正確？","o":["Bagging 平行訓練獨立模型以降低變異；Boosting 依序訓練、修正前面錯誤以降低偏差","兩者完全相同","兩者都不能使用決策樹","兩者剛好相反"],"a":0,"e":"隨機森林是 Bagging 的代表；AdaBoost、GBDT、XGBoost 是 Boosting 的代表。"},{"n":176,"t":"gb","s":"梯度提升模型的最終預測形式為何？","o":["F(x) = F₀(x) + η·Σhₘ(x)，初始預測加上所有樹的縮放貢獻","所有樹的多數投票","取最大的一棵樹的輸出","只用第一棵樹的輸出"],"a":0,"e":"F₀ 通常是常數（如平均值或 log-odds），之後每棵樹 hₘ 乘上學習率累加。"},{"n":177,"t":"met","s":"精確率（Precision）的公式為何？","o":["FP / (FP + TN)","(TP + TN) / 全部","TP / (TP + FP)","TP / (TP + FN)"],"a":2,"e":"Precision：預測為正的樣本中，真正是正的比例。"},{"n":178,"t":"met","s":"召回率（Recall）的公式為何？","o":["TP / (TP + FN)","TN / (TN + FP)","TP / (TP + FP)","(TP + TN) / 全部"],"a":0,"e":"Recall（又稱 Sensitivity、TPR）：真正為正的樣本中，被找出來的比例。"},{"n":179,"t":"met","s":"F1-score 的定義為何？","o":["Precision 與 Recall 的調和平均 2PR / (P + R)","Accuracy 的平方","Precision 與 Recall 的算術平均","TP 除以全部樣本"],"a":0,"e":"調和平均讓 P、R 任一個很低時 F1 也很低，適合不平衡資料。"},{"n":180,"t":"met","s":"什麼情況下 Accuracy 最容易產生誤導？","o":["類別完全平衡時","回歸問題","資料量很小但平衡時","類別嚴重不平衡，例如 99% 都是負類"],"a":3,"e":"全部猜負類就有 99% 準確率，但一個正類都沒找到；應改看 Recall、F1、PR-AUC。"},{"n":181,"t":"met","s":"ROC 曲線的 x 軸與 y 軸分別是什麼？","o":["x 軸 FPR（偽陽性率），y 軸 TPR（真陽性率）","x 軸 Precision，y 軸 Recall","x 軸 Recall，y 軸 Accuracy","x 軸閾值，y 軸 MSE"],"a":0,"e":"ROC 描繪不同閾值下 TPR 與 FPR 的取捨；PR 曲線才是 Recall 對 Precision。"},{"n":182,"t":"met","s":"ROC-AUC = 0.5 代表什麼？","o":["模型過擬合","完美分類","與隨機猜測的效果相同","完全預測相反"],"a":2,"e":"AUC = 1 為完美；0.5 為隨機；小於 0.5 代表比隨機還差（把預測反過來反而更好）。"},{"n":183,"t":"met","s":"垃圾郵件過濾中，把重要的正常信誤判為垃圾信代價很高，應優先重視哪個指標？","o":["MAE","Precision（精確率）","R²","Recall（召回率）"],"a":1,"e":"誤判正常信為垃圾信是 FP；Precision 高代表被判成垃圾信的幾乎都真的是垃圾信。"},{"n":184,"t":"met","s":"回歸指標 RMSE 相較 MSE 的優點是什麼？","o":["沒有單位","與目標變數的單位相同，較容易解釋","完全不受異常值影響","一定介於 0 到 1"],"a":1,"e":"RMSE = √MSE；例如預測房價時 RMSE 的單位就是「元」。"},{"n":185,"t":"met","s":"平均絕對誤差（MAE）的公式為何？","o":["√((1/n)Σ(yᵢ − ŷᵢ)²)","(1/n)Σ|yᵢ − ŷᵢ|","1 − SSE/SST","(1/n)Σ(yᵢ − ŷᵢ)²"],"a":1,"e":"MAE 對每個誤差一視同仁，對異常值較 MSE 穩健。"},{"n":186,"t":"met","s":"R² 有可能是負數嗎？","o":["不可能，R² 一定介於 0 到 1","只有分類問題才會是負數","可以，在測試資料上表現比直接預測平均值還差時","只有在訓練資料上才會是負數"],"a":2,"e":"R² = 1 − SSE/SST，SSE > SST 時即為負值；含截距的 OLS 在訓練集上則不會為負。"},{"n":187,"t":"met","s":"偽陽性率（False Positive Rate, FPR）的公式為何？","o":["TN / (TN + FN)","FP / (FP + TN)","FP / (FP + TP)","FN / (FN + TP)"],"a":1,"e":"FPR = 1 − Specificity，表示真正的負類中被誤判為正的比例。"},{"n":188,"t":"met","s":"混淆矩陣 TP = 40、FP = 10、FN = 20、TN = 30，準確率（Accuracy）是多少？","o":["60%","80%","70%","40%"],"a":2,"e":"(TP + TN) / 全部 = (40 + 30) / 100 = 70%。"},{"n":189,"t":"met","s":"同一組混淆矩陣 TP = 40、FP = 10、FN = 20、TN = 30，召回率（Recall）約是多少？","o":["0.57","0.70","0.80","0.67"],"a":3,"e":"Recall = 40 / (40 + 20) ≈ 0.67；Precision 則是 40 / (40 + 10) = 0.80。"},{"n":190,"t":"met","s":"正類極為稀少的不平衡資料中，為什麼常改看 PR 曲線（Precision-Recall Curve）而不是 ROC？","o":["ROC 的 FPR 分母含大量 TN，會讓表現看起來過度樂觀","兩者沒有差別","ROC 只能用在回歸","PR 曲線計算比較快"],"a":0,"e":"負類非常多時，FP 增加很多 FPR 也只上升一點；Precision 則會明顯反映誤報。"},{"n":191,"t":"prac","s":"監督式學習（Supervised Learning）的定義是什麼？","o":["在沒有標籤的資料中找群組","用帶標籤的資料 (X, y) 學習從特徵到目標的映射","透過獎勵與環境互動學習策略","只用來生成新資料"],"a":1,"e":"有標籤是監督式學習的關鍵；分群屬於非監督式學習，獎勵學習屬於強化學習。"},{"n":192,"t":"prac","s":"k 折交叉驗證（k-Fold Cross-Validation）是怎麼進行的？","o":["資料分成 k 份，輪流用 1 份驗證、k − 1 份訓練，再平均 k 次結果","用測試集反覆調整參數","只切一次訓練集與測試集","只用全部資料訓練，不做驗證"],"a":0,"e":"每筆資料都恰好當過一次驗證資料，評估結果比單次切分更穩定。"},{"n":193,"t":"prac","s":"下列哪個做法會造成資料洩漏（Data Leakage）？","o":["先用全部資料 fit StandardScaler，再切分訓練集與測試集","測試集只在最後評估一次","先切分資料，只用訓練集 fit 標準化","用 Pipeline 把前處理與模型包在一起做交叉驗證"],"a":0,"e":"測試集的平均與標準差洩漏進訓練流程，會讓評估結果過度樂觀。"},{"n":194,"t":"prac","s":"測試集（Test Set）的正確用途是什麼？","o":["所有調參完成後，最後評估一次泛化表現","用來調整超參數","反覆用來挑選特徵","加入訓練資料一起訓練"],"a":0,"e":"調參應使用驗證集或交叉驗證；反覆看測試集等於間接在它上面訓練。"},{"n":195,"t":"prac","s":"網格搜尋（Grid Search）是什麼？","o":["隨機抽取超參數組合","窮舉所有指定的超參數組合，搭配交叉驗證找出最佳組合","用梯度下降調整超參數","用貝氏模型預測下一組超參數"],"a":1,"e":"sklearn 的 GridSearchCV；組合數會隨超參數數量呈指數成長。"},{"n":196,"t":"prac","s":"隨機搜尋（Random Search）相較網格搜尋的優點是什麼？","o":["在超參數空間很大時，能用較少次數找到不錯的組合","沒有任何優點","保證找到全域最佳組合","不需要交叉驗證"],"a":0,"e":"只有少數超參數真正重要時，隨機搜尋能在重要維度上嘗試更多不同的值。"},{"n":197,"t":"prac","s":"模型的訓練誤差和驗證誤差都很高，代表什麼？","o":["高偏差、欠擬合（Underfitting）","模型表現完美","發生資料洩漏","高變異、過擬合（Overfitting）"],"a":0,"e":"模型太簡單抓不到規律；可增加特徵、提高模型複雜度或降低正則化。"},{"n":198,"t":"prac","s":"下列哪個是處理類別不平衡的常見方法？","o":["SMOTE 過採樣、欠採樣或設定 class_weight","複製更多多數類樣本","只看 Accuracy 評估","刪除所有少數類樣本"],"a":0,"e":"也可搭配合適的指標（Recall、F1、PR-AUC）與閾值調整。"},{"n":199,"t":"prac","s":"對時間序列資料（如股價）做交叉驗證時，應該注意什麼？","o":["依時間順序切分（如 TimeSeriesSplit），不能隨機打亂","一定要隨機打亂後再 KFold","時間序列不需要驗證","用未來資料訓練、過去資料驗證"],"a":0,"e":"隨機打亂會讓模型「看到未來」，造成過度樂觀的評估。"},{"n":200,"t":"prac","s":"下列哪一組模型「最需要」先做特徵縮放？","o":["決策樹與隨機森林","決策樹與 XGBoost","隨機森林與 XGBoost","KNN 與 SVM"],"a":3,"e":"依賴距離或內積的模型（KNN、SVM），以及加正則化的線性模型都需要縮放；樹模型則不需要。"}]};
const KEY = "aiot-quiz1-bank-v1";
const L = "ABCD";
let state = { mode: "practice", topic: "all", wrongOnly: false, picks: {} };
try { Object.assign(state, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const topicName = Object.fromEntries(DATA.topics.map(t => [t.k, t]));
const $ = id => document.getElementById(id);

function renderChips() {
  const counts = {};
  DATA.items.forEach(it => counts[it.t] = (counts[it.t] || 0) + 1);
  const all = [{ k: "all", zh: "全部", n: DATA.items.length }].concat(DATA.topics.map(t => ({ k: t.k, zh: t.zh, n: counts[t.k] })));
  $("chips").innerHTML = all.map(t =>
    `<button type="button" class="chip" data-topic="${t.k}" aria-pressed="${state.topic === t.k}">${esc(t.zh)}<small>${t.n}</small></button>`).join("");
}

function card(it) {
  const pick = state.picks[it.n];
  const answered = pick !== undefined;
  const show = state.mode === "review" || answered;
  const opts = it.o.map((o, j) => {
    let cls = "opt";
    if (show && j === it.a) cls += " ok";
    if (state.mode === "practice" && answered && j === pick && pick !== it.a) cls += " no";
    const dis = state.mode === "review" || answered ? " disabled" : "";
    return `<button type="button" class="${cls}" data-q="${it.n}" data-j="${j}"${dis}><span class="k">${L[j]}.</span><span>${esc(o)}</span></button>`;
  }).join("");
  let ans = "";
  if (show) {
    const verdict = state.mode === "practice" && answered
      ? (pick === it.a ? "答對了。" : `<span class="wrong">你選 ${L[pick]}，答錯了。</span>`) : "";
    ans = `<div class="ans">${verdict}<b>答案：${L[it.a]}</b><br>解析：${esc(it.e)}</div>`;
  }
  return `<article class="q" id="q${it.n}"><h3><span class="no">${it.n}</span><span>${esc(it.s)}</span></h3><div class="opts">${opts}</div>${ans}</article>`;
}

function render() {
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === state.mode));
  $("wrongOnly").setAttribute("aria-pressed", state.wrongOnly);
  $("wrongOnly").hidden = state.mode !== "practice";
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.topic === state.topic));

  let items = DATA.items.filter(it => state.topic === "all" || it.t === state.topic);
  if (state.mode === "practice" && state.wrongOnly) items = items.filter(it => state.picks[it.n] !== undefined && state.picks[it.n] !== it.a);

  let html = "", cur = null;
  for (const it of items) {
    if (it.t !== cur) {
      cur = it.t;
      const t = topicName[cur];
      html += `<h2 class="sec-title">${esc(t.zh)}<span>${esc(t.en)}</span></h2>`;
    }
    html += card(it);
  }
  $("list").innerHTML = html || `<p class="empty">${state.wrongOnly ? "目前沒有答錯的題目。" : "沒有題目。"}</p>`;
  renderScore();
}

function renderScore() {
  const scope = DATA.items.filter(it => state.topic === "all" || it.t === state.topic);
  const done = scope.filter(it => state.picks[it.n] !== undefined);
  const right = done.filter(it => state.picks[it.n] === it.a).length;
  const pct = done.length ? Math.round(right / done.length * 100) : 0;
  $("score").innerHTML = `答對 <b>${right}</b> / 已答 <b>${done.length}</b> / 共 ${scope.length}` + (done.length ? `（${pct}%）` : "");
}

document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.mode) { state.mode = b.dataset.mode; save(); render(); }
  else if (b.dataset.topic) { state.topic = b.dataset.topic; save(); render(); window.scrollTo({ top: $("list").offsetTop - 140 }); }
  else if (b.id === "wrongOnly") { state.wrongOnly = !state.wrongOnly; save(); render(); }
  else if (b.id === "reset") {
    if (confirm("清除所有作答紀錄？")) { state.picks = {}; state.wrongOnly = false; save(); render(); }
  }
  else if (b.dataset.q) {
    const n = +b.dataset.q, it = DATA.items[n - 1];
    state.picks[n] = +b.dataset.j; save();
    document.getElementById("q" + n).outerHTML = card(it);
    renderScore();
  }
});

renderChips();
render();
</script>
